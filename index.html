<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fapi.binance.com" crossorigin />
<link rel="dns-prefetch" href="https://fapi.binance.com" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tickr" />
<title>Tickr</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
    --safe-bottom: env(safe-area-inset-bottom);
  }
  html.pwa-standalone {
    --safe-bottom: 34px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: var(--safe-bottom);
    touch-action: manipulation;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 110px;
  }
  .group-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px 8px;
  }
  .nav-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-nav-bar {
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .bottom-nav-bar.ready {
    opacity: 1;
  }
  .nav-highlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-highlight {
      transition: none;
    }
  }
  .nav-btn {
    position: relative;
    z-index: 1;
    width: 92px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .nav-btn.active {
    color: #04201d;
  }
  .nav-btn.nav-btn-disabled {
    opacity: 0.3;
    cursor: default;
  }
  .top-header {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: 16px;
    margin-bottom: -16px;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .currency-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .currency-btn {
    width: 33px;
    height: 27px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--accent);
    color: #04201d;
  }
  .search-icon-btn {
    width: 42px;
    height: 32px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mode-tabs-wrap {
    position: relative;
    margin: 0 -16px 12px;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    padding: 0 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mode-tabs::-webkit-scrollbar {
    display: none;
  }
  .tabs-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
  }
  .tabs-fade.show {
    opacity: 1;
  }
  .tabs-fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  .tabs-fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }
  .mode-tab {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .search-page {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .search-page.open {
    display: flex;
  }
  .search-page-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .search-page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex: 0 0 auto;
  }
  .search-input-row {
    position: relative;
    margin-top: 14px;
    flex: 0 0 auto;
  }
  .search-input-row svg.search-input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .search-page-input {
    width: 100%;
    height: 48px;
    padding: 0 44px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .search-page-input::placeholder {
    color: var(--ink-sub);
  }
  .search-page-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear-btn[hidden] {
    display: none;
  }
  .search-page-list {
    margin-top: 20px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .row.search-row-item {
    grid-template-columns: 1fr auto auto;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: #1a1d22;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  /* ---------- Home ---------- */
  .list.home-view {
    background: none;
    border: none;
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .home-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .portfolio-label {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }
  .portfolio-total {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .portfolio-pnl {
    margin-top: 4px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .portfolio-pnl.up { color: var(--up); }
  .portfolio-pnl.down { color: var(--down); }
  .add-holding-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .home-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .home-section-title {
    font-size: 15px;
    font-weight: 800;
  }
  .home-edit-link {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-sub);
    cursor: pointer;
  }
  .watchlist-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .watchlist-item {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
  }
  .watchlist-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .watchlist-symbol {
    min-width: 0;
  }
  .watchlist-symbol-name {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .watchlist-symbol-kr {
    font-size: 11px;
    color: var(--ink-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .watchlist-remove-btn {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 999px;
    background: var(--down);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .watchlist-sparkline {
    width: 100%;
    height: 40px;
    display: block;
    margin-bottom: 8px;
  }
  .watchlist-price {
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .watchlist-change {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .watchlist-change.up { color: var(--up); }
  .watchlist-change.down { color: var(--down); }
  .watchlist-qty {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-sub);
  }
  .indicators-table {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    margin-top: 8px;
    border-radius: 10px;
    overflow: hidden;
  }
  .indicator-cell {
    background: var(--panel);
    padding: 12px;
  }
  .fng-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 6px;
  }
  .indicator-label {
    font-size: 12px;
    color: var(--ink-sub);
    margin-bottom: 6px;
  }
  .indicator-value {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .indicator-change {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
  }
  .indicator-change.up { color: var(--up); }
  .indicator-change.down { color: var(--down); }
  .fng-card {
    text-align: center;
    padding: 4px 8px;
  }
  .fng-gauge-svg {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 2px;
  }
  .fng-value {
    margin-top: -6px;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .fng-label {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .fng-label.up { color: var(--up); }
  .fng-label.down { color: var(--down); }

  /* ---------- Add holding overlay ---------- */
  .add-holding-page {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .add-holding-page.open {
    display: flex;
  }
  .add-holding-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .add-holding-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex: 0 0 auto;
  }
  .add-holding-search-row {
    position: relative;
    flex: 0 0 auto;
  }
  .add-holding-search-row svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .add-holding-search-input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .add-holding-search-input::placeholder {
    color: var(--ink-sub);
  }
  .add-holding-search-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-holding-results {
    margin-top: 16px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .add-holding-form {
    margin-top: 16px;
    flex: 0 0 auto;
  }
  .add-holding-selected {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .add-holding-selected-name {
    font-size: 15px;
    font-weight: 800;
  }
  .add-holding-selected-kr {
    font-size: 12px;
    color: var(--ink-sub);
  }
  .add-holding-change-btn {
    text-align: center;
    margin-bottom: 16px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .add-holding-field {
    margin-bottom: 14px;
  }
  .add-holding-field label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-sub);
    margin-bottom: 6px;
  }
  .add-holding-field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box;
  }
  .add-holding-field input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-holding-submit {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #04201d;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .add-holding-submit:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .chart-overlay.open {
    display: flex;
  }
  .chart-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
  }
  .chart-modal-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    flex: 0 0 auto;
  }
  .chart-symbol-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex: 0 0 auto;
  }
  .chart-symbol {
    font-size: 20px;
    font-weight: 800;
  }
  .chart-symbol-kr {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-sub);
    margin-top: 2px;
  }
  .chart-close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .chart-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
    flex: 0 0 auto;
  }
  .chart-price {
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chart-change {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-change.up { color: var(--up); }
  .chart-change.down { color: var(--down); }
  .chart-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 180px;
    max-height: 320px;
    touch-action: pan-y;
  }
  @media (max-width: 767px) {
    .chart-canvas-wrap {
      flex: 0 0 220px;
    }
  }
  #chartCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-sub);
    font-size: 13px;
  }
  .chart-scrub-label {
    position: absolute;
    top: 0;
    display: none;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .scrub-date {
    font-size: 11px;
    color: var(--ink-sub);
  }
  .scrub-price {
    font-size: 15px;
    font-weight: 800;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .chart-ranges {
    display: flex;
    gap: 6px;
    margin-top: 20px;
    flex: 0 0 auto;
  }
  .chart-range-btn {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink-sub);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .chart-range-btn.active {
    background: var(--accent);
    color: #04201d;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="top-header">
      <div class="header">

    if (currency === 'KRW') return Math.round(v).toLocaleString('ko-KR') + '원';
    if (v >= 100) return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (v >= 1) return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  // Live-formats a number input as the user types: adds thousands commas and
  // an optional currency prefix/suffix (e.g. "21874" -> "21,874원").
  function formatMaskedValue(raw, { prefix = '', suffix = '', decimals = 0 } = {}) {
    if (!raw) return '';
    const [intRaw, decRaw] = raw.split('.');
    const intPart = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const out = decimals > 0 && decRaw !== undefined ? `${intPart}.${decRaw}` : intPart;
    return prefix + out + suffix;
  }
  function attachMaskedNumberInput(el, opts) {
    el.addEventListener('input', () => {
      let raw = el.value.replace(/[^\d.]/g, '');
      if (opts.decimals <= 0) {
        raw = raw.replace(/\./g, '');
      } else {
        const firstDot = raw.indexOf('.');
        if (firstDot !== -1) {
          raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
          const [i, d] = raw.split('.');
          raw = d.length > opts.decimals ? `${i}.${d.slice(0, opts.decimals)}` : raw;
        }
      }
      el.value = formatMaskedValue(raw, opts);
    });
  }
  function parseMaskedNumber(value) {
    const n = Number(String(value).replace(/[^\d.]/g, ''));
    return Number.isFinite(n) ? n : 0;
  }

  function displayName(symbol) {
    return symbol.replace(/USDT$/, '');

    const meta = symbolMeta[t.symbol];
    if (!meta || meta.status !== 'TRADING') return false;
    const base = meta.base;
    switch (mode) {
      case 'domestic':
        return meta.type === 'KR_EQUITY';
      case 'us':
        return meta.type === 'EQUITY' && !LEVERAGE_TICKERS.has(base) && !INDEX_COMMODITY_TICKERS.has(base);
      case 'leverage':

      case 'index':

      case 'crypto':
        return meta.type === 'COIN' && meta.contractType === 'PERPETUAL';
      default:

    }
  }

  function holdingStats(h) {
    const t = findTicker(h.symbol);
    const lastPrice = t ? Number(t.lastPrice) : 0;
    const changePct = t ? Number(t.priceChangePercent) : 0;
    const valueUsd = h.qty * lastPrice;
    // Current value always converts at today's FX rate (that's genuinely what
    // it's worth right now). Cost basis uses whichever currency's price the
    // user actually entered, with no conversion -- the won/dollar prices were
    // recorded independently since the FX rate at "purchase" time may differ
    // from today's, and re-deriving one from the other would drift.
    const valueNative = currency === 'KRW' && krwRate ? valueUsd * krwRate : valueUsd;
    const avgPriceNative = currency === 'KRW' ? h.avgPriceKrw || 0 : h.avgPriceUsd || 0;
    const costNative = h.qty * avgPriceNative;
    const pnlNative = valueNative - costNative;
    const pnlPct = costNative ? (pnlNative / costNative) * 100 : 0;
    return { lastPrice, changePct, valueNative, costNative, pnlNative, pnlPct };
  }

  function drawSparkline(canvas, closes) {
    if (!canvas || closes.length < 2) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const pad = 3;
    const usableH = h - pad * 2;
    const points = closes.map((c, i) => {
      const x = (i / (closes.length - 1)) * w;
      const y = pad + (1 - (c - min) / range) * usableH;
      return [x, y];
    });
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  async function loadSparklines() {
    const canvases = listEl.querySelectorAll('[data-sparkline]');
    await Promise.all(
      [...canvases].map(async (canvas) => {
        const symbol = canvas.dataset.sparkline;
        try {
          const klines = await fetchJson(`${FAPI}/klines?symbol=${symbol}&interval=15m&limit=96`);
          const closes = klines.map((k) => Number(k[4]));
          drawSparkline(canvas, closes);
        } catch (e) {
          // leave blank on failure
        }
      }),
    );
  }

        </div>
      </div>
    `;

    function fngGaugeSvg(value) {
      const cx = 100;
      const cy = 92;
      const r = 78;
      const sw = 16;
      const v = Math.max(0, Math.min(100, value));
      const pointAt = (val, rad) => {
        const a = Math.PI - (val / 100) * Math.PI;
        return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)];
      };
      const segments = [
        { from: 0, to: 20, color: '#ff3b30' },
        { from: 20, to: 40, color: '#ff9500' },
        { from: 40, to: 60, color: '#f2d000' },
        { from: 60, to: 80, color: '#a8d400' },
        { from: 80, to: 100, color: '#2ecc71' },
      ];
      const arcs = segments
        .map((seg) => {
          const [x1, y1] = pointAt(seg.from, r);
          const [x2, y2] = pointAt(seg.to, r);
          return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-linecap="butt" />`;
        })
        .join('');
      const [nx, ny] = pointAt(v, r - sw / 2 - 6);
      return `
        <svg viewBox="0 0 200 102" class="fng-gauge-svg">
          ${arcs}
          <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          <circle cx="${cx}" cy="${cy}" r="5" fill="#fff" />
        </svg>
      `;
    }

      return `

          <div class="fng-value">${fng ? fng.value : '-'}</div>
          ${fng ? `<div class="fng-label ${cls}">${FNG_LABELS_KR[fng.label] || fng.label}</div>` : ''}
        </div>

    }

  async function loadFxRate() {
    // Upbit's KRW-USDT trade price is a genuinely live rate (updates with every
    // trade on an active market), unlike open.er-api.com which only refreshes
    // once a day. USDT tracks the dollar closely enough to use as a USD proxy.
    try {
      const data = await fetchJson('https://api.upbit.com/v1/ticker?markets=KRW-USDT');
      const rate = data && data[0] && Number(data[0].trade_price);
      if (rate) {
        krwRate = rate;
        return;
      }
    } catch (e) {
      // fall through to backup source below
    }
    try {
      const data = await fetchJson('https://open.er-api.com/v6/latest/USD');
      if (data && data.rates && data.rates.KRW) krwRate = data.rates.KRW;
    } catch (e) {
      // keep previous rate on failure
    }
  }

  function setCurrency(cur) {

  currencyToggleEls.forEach((group) => {

  loadFxRate();
  setInterval(loadFxRate, REFRESH_MS);
  loadFearGreed();

  loadStockFearGreed();
  setInterval(loadStockFearGreed, FX_REFRESH_MS);
  loadVixUs10y();
  setInterval(loadVixUs10y, FX_REFRESH_MS);
  loadMeta().then(refreshAll);
  setInterval(refreshAll, REFRESH_MS);

  /* ---------- Chart modal ---------- */
  const wrapEl = document.querySelector('.wrap');
  const chartOverlay = document.getElementById('chartOverlay');
  const chartClose = document.getElementById('chartClose');
  const chartSymbolEl = document.getElementById('chartSymbol');
  const chartSymbolKrEl = document.getElementById('chartSymbolKr');
  const chartPriceEl = document.getElementById('chartPrice');
  const chartChangeEl = document.getElementById('chartChange');
  const chartCanvas = document.getElementById('chartCanvas');
  const chartLoadingEl = document.getElementById('chartLoading');
  const chartRangesEl = document.getElementById('chartRanges');
  const chartScrubLabelEl = document.getElementById('chartScrubLabel');
  const scrubDateEl = document.getElementById('scrubDate');
  const scrubPriceEl = document.getElementById('scrubPrice');
  const ctx = chartCanvas.getContext('2d');

  const RANGES = {
    '1D': { interval: '15m', limit: 96 },
    '1W': { interval: '1h', limit: 168 },
    '3M': { interval: '1d', limit: 90 },
    '1Y': { interval: '1d', limit: 365 },
    '5Y': { interval: '1w', limit: 260 },
    ALL: { interval: '1M', limit: 1000 },
  };

  let currentSymbol = null;
  let currentRange = '1D';
  let chartCloses = [];
  let chartTimes = [];
  let scrubbing = false;

  function drawChart(closes, hoverIdx) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const padTop = 56;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    const points = closes.map((c, i) => {
      const x = (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[0][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    if (hoverIdx != null && points[hoverIdx]) {
      const [hx, hy] = points[hoverIdx];
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, 0);
      ctx.lineTo(hx, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(hx, hy, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0a0b0d';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function formatScrubDate(ts) {
    const d = new Date(ts);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (currentRange === '1D' || currentRange === '1W') {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi}`;
    }
    return `${d.getFullYear()}.${mm}.${dd}`;
  }

  function scrubAt(clientX) {
    if (chartCloses.length < 2) return;
    const rect = chartCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    let idx = Math.round((x / rect.width) * (chartCloses.length - 1));
    idx = Math.max(0, Math.min(chartCloses.length - 1, idx));
    drawChart(chartCloses, idx);
    scrubDateEl.textContent = formatScrubDate(chartTimes[idx]);
    scrubPriceEl.textContent = formatPrice(chartCloses[idx]);
    chartScrubLabelEl.style.display = 'block';
    const lw = chartScrubLabelEl.offsetWidth;
    const hx = (idx / (chartCloses.length - 1)) * rect.width;
    const left = Math.max(4, Math.min(rect.width - lw - 4, hx - lw / 2));
    chartScrubLabelEl.style.left = `${left}px`;
  }

  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    chartScrubLabelEl.style.display = 'none';
    drawChart(chartCloses);
  }

  chartCanvas.addEventListener('mousedown', (e) => {
    scrubbing = true;
    scrubAt(e.clientX);
  });
  chartCanvas.addEventListener('mousemove', (e) => {
    if (scrubbing) scrubAt(e.clientX);
  });
  window.addEventListener('mouseup', endScrub);
  chartCanvas.addEventListener('touchstart', (e) => {
    scrubbing = true;
    scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchmove', (e) => {
    if (scrubbing) scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchend', endScrub);

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    chartScrubLabelEl.style.display = 'none';
    const { interval, limit } = RANGES[currentRange];
    try {
      const klines = await fetchJson(
        `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`,
      );
      const closes = klines.map((k) => Number(k[4]));
      const times = klines.map((k) => Number(k[0]));
      const first = closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = formatPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;
      chartCloses = closes;
      chartTimes = times;
      drawChart(closes);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol, cat) {
    currentSymbol = symbol;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    const name = displayName(symbol);
    chartSymbolEl.textContent = name;
    const kr = krName(name, cat);
    chartSymbolKrEl.textContent = kr || '';
    chartSymbolKrEl.style.display = kr ? '' : 'none';
    chartOverlay.classList.add('open');
    loadChart();
  }

  function closeChart() {
    chartOverlay.classList.remove('open');
    currentSymbol = null;
  }

  listEl.addEventListener('click', (e) => {
    if (e.target.closest('#addHoldingLink')) {
      openAddHolding();
      return;
    }
    if (e.target.closest('#watchlistEditLink')) {
      watchlistEditMode = !watchlistEditMode;
      renderHome();
      return;
    }
    const removeBtn = e.target.closest('.watchlist-remove-btn');
    if (removeBtn) {
      holdings = holdings.filter((h) => h.symbol !== removeBtn.dataset.remove);
      saveHoldings();
      renderHome();
      return;
    }
    const watchItem = e.target.closest('.watchlist-item');
    if (watchItem) {
      openChart(watchItem.dataset.symbol, watchItem.dataset.cat);
      return;
    }
    const row = e.target.closest('.row');
    if (row) openChart(row.dataset.symbol, row.dataset.cat);
  });
  searchPageListEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    closeSearch();
    openChart(row.dataset.symbol, row.dataset.cat);
  });
  addHoldingResultsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) selectAddHoldingSymbol(row.dataset.symbol, row.dataset.cat);
  });
  addHoldingChangeBtn.addEventListener('click', () => {
    addHoldingSelected = null;
    addHoldingFormEl.hidden = true;
    addHoldingSearchRowEl.style.display = '';
    addHoldingResultsEl.style.display = '';
    addHoldingSearchInput.focus();
  });
  addHoldingSearchInput.addEventListener('input', () => {
    renderAddHoldingResults(addHoldingSearchInput.value);
  });
  attachMaskedNumberInput(addHoldingQtyInput, { suffix: ' 주', decimals: 8 });
  attachMaskedNumberInput(addHoldingAvgPriceKrwInput, { suffix: '원', decimals: 0 });
  attachMaskedNumberInput(addHoldingAvgPriceUsdInput, { prefix: '$', decimals: 2 });

  addHoldingSubmitBtn.addEventListener('click', () => {
    if (!addHoldingSelected) return;
    const qty = parseMaskedNumber(addHoldingQtyInput.value);
    const avgPriceKrw = parseMaskedNumber(addHoldingAvgPriceKrwInput.value);
    const avgPriceUsd = parseMaskedNumber(addHoldingAvgPriceUsdInput.value);
    if (!qty || qty <= 0 || !avgPriceKrw || avgPriceKrw <= 0 || !avgPriceUsd || avgPriceUsd <= 0) return;
    const idx = holdings.findIndex((h) => h.symbol === addHoldingSelected.symbol);
    const entry = { symbol: addHoldingSelected.symbol, cat: addHoldingSelected.cat, qty, avgPriceKrw, avgPriceUsd };
    if (idx >= 0) holdings[idx] = entry;
    else holdings.push(entry);
    saveHoldings();
    closeAddHolding();
    if (view === 'home') renderHome();
  });
  addHoldingClose.addEventListener('click', closeAddHolding);
  addHoldingPageEl.addEventListener('click', (e) => {
    if (e.target === addHoldingPageEl) closeAddHolding();
  });
  chartClose.addEventListener('click', closeChart);
  chartOverlay.addEventListener('click', (e) => {
    if (e.target === chartOverlay) closeChart();
  });
  chartRangesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-range-btn');
    if (!btn) return;
    currentRange = btn.dataset.range;
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    loadChart();
  });

  let chartSwipeX = 0;
  let chartSwipeY = 0;
  let chartSwipeStart = 0;
  let chartSwipeTracking = false;
  let chartSwipeDragging = false;

  function resetWrapTransform() {
    wrapEl.style.transition = 'none';
    wrapEl.style.transform = '';
  }

  chartOverlay.addEventListener('touchstart', (e) => {
    if (e.target.closest('.chart-canvas-wrap')) {
      chartSwipeTracking = false;
      return;
    }
    chartSwipeTracking = true;
    chartSwipeDragging = false;
    chartSwipeX = e.touches[0].clientX;
    chartSwipeY = e.touches[0].clientY;
    chartSwipeStart = Date.now();
    chartOverlay.style.transition = 'none';
  }, { passive: true });

  chartOverlay.addEventListener('touchmove', (e) => {
    if (!chartSwipeTracking) return;
    const dx = e.touches[0].clientX - chartSwipeX;
    const dy = e.touches[0].clientY - chartSwipeY;
    if (!chartSwipeDragging) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) {
        chartSwipeTracking = false;
        return;
      }
      chartSwipeDragging = true;
      wrapEl.style.transition = 'none';
    }
    e.preventDefault();
    chartOverlay.style.transform = `translateX(${dx}px)`;
    const progress = Math.min(Math.abs(dx) / window.innerWidth, 1);
    const dir = dx > 0 ? 1 : -1;
    wrapEl.style.transform = `translateX(${-dir * (1 - progress) * 30}%)`;
  }, { passive: false });

  chartOverlay.addEventListener('touchend', (e) => {
    if (!chartSwipeTracking) return;
    chartSwipeTracking = false;
    const dx = e.changedTouches[0].clientX - chartSwipeX;
    const dy = e.changedTouches[0].clientY - chartSwipeY;
    const elapsed = Date.now() - chartSwipeStart;
    const velocity = Math.abs(dx) / Math.max(elapsed, 1);
    chartOverlay.style.transition = 'transform 0.25s ease';
    wrapEl.style.transition = 'transform 0.25s ease';
    if (chartSwipeDragging && Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > 90 || velocity > 0.5)) {
      const dir = dx > 0 ? 1 : -1;
      chartOverlay.style.transform = `translateX(${dir * 100}%)`;
      wrapEl.style.transform = 'translateX(0)';
      setTimeout(() => {
        closeChart();
        chartOverlay.style.transition = 'none';
        chartOverlay.style.transform = '';
        resetWrapTransform();
      }, 250);
    } else {
      chartOverlay.style.transform = 'translateX(0)';
      wrapEl.style.transform = 'translateX(0)';
      if (chartSwipeDragging) setTimeout(resetWrapTransform, 250);
    }
    chartSwipeDragging = false;
  }, { passive: true });

  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update().catch(() => {}));
      }
    });
  }
</script>

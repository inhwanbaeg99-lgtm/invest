<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fapi.binance.com" crossorigin />
<link rel="dns-prefetch" href="https://fapi.binance.com" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#f2f4f6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tickr" />
<title>Tickr</title>
<style>
  :root {
    --bg: #f2f4f6;
    --panel: #ffffff;
    --line: #e5e8eb;
    --ink: #191f28;
    --ink-sub: #8b95a1;
    --up: #ff5c5c;
    --down: #3182f6;
    --accent: #2ecc71;
    --safe-bottom: env(safe-area-inset-bottom);
  }
  html.pwa-standalone {
    --safe-bottom: 34px;
  }
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: var(--safe-bottom);
    touch-action: manipulation;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 110px;
  }
  .group-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px 8px;
  }
  .nav-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-nav-bar {
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .bottom-nav-bar.ready {
    opacity: 1;
  }
  .nav-highlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-highlight {
      transition: none;
    }
  }
  .nav-btn {
    position: relative;
    z-index: 1;
    width: 92px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .nav-btn.active {
    color: #04201d;
  }
  .top-header {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: 16px;
    margin-bottom: -16px;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .currency-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .currency-btn {
    width: 33px;
    height: 27px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--accent);
    color: #04201d;
  }
  .search-icon-btn {
    width: 42px;
    height: 32px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .app-install-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .install-guide-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.5);
    display: none;
  }
  .install-guide-backdrop.open {
    display: block;
  }
  .install-guide-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 20px 20px 0 0;
    padding: 10px 20px calc(24px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .install-guide-backdrop.open .install-guide-sheet {
    transform: translateY(0);
  }
  .install-guide-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 0 auto 16px;
  }
  .install-guide-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .install-guide-title {
    font-size: 17px;
    font-weight: 800;
  }
  .install-guide-close {
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .install-guide-step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }
  .install-guide-step-num {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #04201d;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .install-guide-step-text {
    flex: 1 1 auto;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  .install-guide-step-text b {
    font-weight: 800;
  }
  .ig-mock {
    margin-top: 10px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .ig-mock-toolbar,
  .ig-mock-sheet-row {
    gap: 6px;
    padding: 8px 12px;
    justify-content: space-between;
  }
  .ig-mock-icon {
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-sub);
    font-size: 14px;
    border-radius: 50%;
  }
  .ig-mock-icon.ig-mock-highlight {
    color: var(--accent);
    background: rgba(46, 204, 113, 0.18);
  }
  .ig-mock-dot {
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--line);
  }
  .ig-mock-more {
    flex: 0 0 auto;
    width: 46px;
    height: 24px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .ig-mock-more.ig-mock-highlight {
    color: var(--accent);
    background: rgba(46, 204, 113, 0.18);
  }
  .ig-mock-list-row {
    gap: 8px;
    padding: 10px 14px;
    background: rgba(46, 204, 113, 0.12);
    border-color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }
  .ig-mock-plus {
    font-size: 14px;
    font-weight: 800;
  }
  .ig-mock-topbar {
    padding: 8px 14px;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-sub);
  }
  .ig-mock-topbar .ig-accent {
    color: var(--accent);
    font-weight: 800;
  }
  .mode-tabs-wrap {
    position: relative;
    margin: 0 -16px 12px;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    padding: 0 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mode-tabs::-webkit-scrollbar {
    display: none;
  }
  @media (min-width: 768px) {
    .mode-tabs {
      justify-content: center;
    }
  }
  .tabs-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
  }
  .tabs-fade.show {
    opacity: 1;
  }
  .tabs-fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  .tabs-fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }
  .mode-tab {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .search-page {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .search-page.open {
    display: flex;
  }
  .search-page-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .search-page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex: 0 0 auto;
  }
  .search-input-row {
    position: relative;
    margin-top: 14px;
    flex: 0 0 auto;
  }
  .search-input-row svg.search-input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .search-page-input {
    width: 100%;
    height: 48px;
    padding: 0 44px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    caret-color: var(--accent);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .search-page-input::placeholder {
    color: var(--ink-sub);
  }
  .search-page-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear-btn[hidden] {
    display: none;
  }
  .search-page-list {
    margin-top: 20px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .row.search-row-item {
    grid-template-columns: 1fr auto auto;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: var(--bg);
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  /* ---------- Home ---------- */
  .list.home-view {
    background: none;
    border: none;
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .home-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .portfolio-card {
    cursor: pointer;
  }
  .portfolio-label {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }
  .portfolio-total-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .portfolio-total {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .portfolio-chevron-icon {
    flex: 0 0 auto;
    color: var(--ink-sub);
  }
  .portfolio-pnl {
    margin-top: 4px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .portfolio-pnl.up { color: var(--up); }
  .portfolio-pnl.down { color: var(--down); }
  .add-holding-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
  }
  .home-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 10px;
  }
  .watchlist-section-header {
    margin-top: 4px;
    margin-bottom: 2px;
  }
  .home-section-title {
    font-size: 16px;
    font-weight: 800;
  }
  .home-edit-link {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-sub);
    cursor: pointer;
  }
  .watchlist-remove-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: #ff5c5c;
    color: #fff;
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .holding-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .holding-row:last-child {
    border-bottom: none;
  }
  .holding-row:hover {
    background: var(--bg);
  }
  .holding-remove-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: #ff5c5c;
    color: #fff;
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .holding-info {
    flex: 1;
    min-width: 0;
  }
  .holding-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .holding-sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--ink-sub);
  }
  .holding-right {
    flex: 0 0 auto;
    text-align: right;
  }
  .holding-value {
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .holding-pnl {
    margin-top: 2px;
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .holding-pnl.up { color: var(--up); }
  .holding-pnl.down { color: var(--down); }
  .holding-add-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 16px;
    color: var(--ink-sub);
    cursor: pointer;
  }
  .holding-add-row-plus {
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
  }
  .indicators-table {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    margin-top: 8px;
    border-radius: 10px;
    overflow: hidden;
  }
  .indicator-cell {
    background: var(--panel);
    padding: 12px;
  }
  .fng-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 6px;
  }
  .indicator-label {
    font-size: 12px;
    color: var(--ink-sub);
    margin-bottom: 6px;
  }
  .indicator-value {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .indicator-change {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
  }
  .indicator-change.up { color: var(--up); }
  .indicator-change.down { color: var(--down); }
  .fng-card {
    text-align: center;
    padding: 4px 8px;
  }
  .fng-gauge-svg {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 2px;
  }
  .fng-value {
    margin-top: -6px;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .fng-label {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .fng-label.greed { color: var(--accent); }
  .fng-label.fear { color: var(--down); }
  .news-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
  }
  .news-subtabs {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .news-subtab-btn {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .news-subtab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .news-item {
    display: block;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .news-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .news-source {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .news-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .news-time {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink-sub);
  }
  .news-preview-wrap {
    position: relative;
  }
  .news-preview-list {
    filter: blur(1.5px);
    opacity: 0.45;
    pointer-events: none;
    user-select: none;
  }
  .news-preview-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, transparent, var(--panel) 65%);
  }
  .news-preview-badge {
    background: var(--panel);

  // Live-formats a number input as the user types: adds thousands commas and
  // an optional currency prefix/suffix (e.g. "21874" -> "21,874원").
  function formatMaskedValue(raw, { prefix = '', suffix = '', decimals = 0 } = {}) {
    if (!raw) return '';
    const [intRaw, decRaw] = raw.split('.');
    const intPart = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const out = decimals > 0 && decRaw !== undefined ? `${intPart}.${decRaw}` : intPart;
    return prefix + out + suffix;
  }
  function attachMaskedNumberInput(el, optsOrFn) {
    el.addEventListener('input', () => {
      const opts = typeof optsOrFn === 'function' ? optsOrFn() : optsOrFn;
      let raw = el.value.replace(/[^\d.]/g, '');
      if (opts.decimals <= 0) {
        raw = raw.replace(/\./g, '');
      } else {
        const firstDot = raw.indexOf('.');
        if (firstDot !== -1) {
          raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
          const [i, d] = raw.split('.');
          raw = d.length > opts.decimals ? `${i}.${d.slice(0, opts.decimals)}` : raw;
        }
      }
      el.value = formatMaskedValue(raw, opts);
    });
  }
  function parseMaskedNumber(value) {

  function holdingStats(h) {
    const t = findTicker(h.symbol);
    const lastPrice = t ? Number(t.lastPrice) : 0;
    const changePct = t ? Number(t.priceChangePercent) : 0;
    const valueUsd = h.qty * lastPrice;
    // Current value always converts at today's FX rate (that's genuinely what
    // it's worth right now). Cost basis uses whichever currency's price the
    // user actually entered, with no conversion -- the won/dollar prices were
    // recorded independently since the FX rate at "purchase" time may differ
    // from today's, and re-deriving one from the other would drift.
    const valueNative = currency === 'KRW' && krwRate ? valueUsd * krwRate : valueUsd;
    const avgPriceNative = currency === 'KRW' ? h.avgPriceKrw || 0 : h.avgPriceUsd || 0;
    const costNative = h.qty * avgPriceNative;
    const pnlNative = valueNative - costNative;
    const pnlPct = costNative ? (pnlNative / costNative) * 100 : 0;
    return { lastPrice, changePct, valueNative, costNative, pnlNative, pnlPct };
  }

      </div>
    `;

    function fngGaugeSvg(value) {
      const cx = 100;
      const cy = 92;
      const r = 78;
      const sw = 16;
      const v = Math.max(0, Math.min(100, value));
      const pointAt = (val, rad) => {
        const a = Math.PI - (val / 100) * Math.PI;
        return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)];
      };
      const segments = [
        { from: 0, to: 20, color: '#ff3b30' },
        { from: 20, to: 40, color: '#ff9500' },
        { from: 40, to: 60, color: '#f2d000' },
        { from: 60, to: 80, color: '#a8d400' },
        { from: 80, to: 100, color: '#2ecc71' },
      ];
      const arcs = segments
        .map((seg) => {
          const [x1, y1] = pointAt(seg.from, r);
          const [x2, y2] = pointAt(seg.to, r);
          return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-linecap="butt" />`;
        })
        .join('');
      const [nx, ny] = pointAt(v, r - sw / 2 - 6);
      return `
        <svg viewBox="0 0 200 102" class="fng-gauge-svg">
          ${arcs}
          <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#191f28" stroke-width="3" stroke-linecap="round" />
          <circle cx="${cx}" cy="${cy}" r="5" fill="#191f28" />
        </svg>
      `;
    }

      return `

          <div class="fng-value">${fng ? fng.value : '-'}</div>
          ${fng ? `<div class="fng-label ${cls}">${FNG_LABELS_KR[fng.label] || fng.label}</div>` : ''}
        </div>
      `;
    }

    const fearGreedHtml = `
      <div class="home-card">
        <div class="portfolio-label">공포·탐욕 지수</div>

  function parseFeedXml(xmlText, format) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) return [];
    const nodes = [...doc.getElementsByTagName(format === 'atom' ? 'entry' : 'item')];
    return nodes
      .map((node) => {
        const text = (tag) => node.querySelector(tag)?.textContent?.trim() || '';
        let link = text('link');
        if (format === 'atom') {
          const linkEls = [...node.getElementsByTagName('link')];
          const alt = linkEls.find((l) => l.getAttribute('rel') === 'alternate') || linkEls[0];
          link = alt ? alt.getAttribute('href') : '';
        }
        const dateStr = format === 'atom' ? text('updated') : text('pubDate');
        const summaryRaw = format === 'atom' ? text('summary') : text('description');
        return {
          title: text('title'),
          link,
          dateStr,
          summary: summaryRaw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(),
        };
      })
      .filter((it) => it.title && it.dateStr);
  }

  async function loadFeedArticles(src) {
    try {
      const xml = await fetch(`${YAHOO_PROXY}rss?url=${encodeURIComponent(src.url)}`).then((r) => r.text());
      return parseFeedXml(xml, src.format)
        .slice(0, 10)
        .map((it) => {
          return {
            title: it.title,
            link: it.link,
            summary: it.summary,
            sourceName: src.name,
            lang: src.lang || 'en',
            ts: new Date(it.dateStr).getTime(),
          };
        });
    } catch (e) {
      return [];
    }
  }

  async function translateText(text) {
    try {
      const res = await fetchJson(
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=${encodeURIComponent(text)}`,
      );
      return res[0].map((seg) => seg[0]).join('');
    } catch (e) {
      return text;
    }
  }

  function timeAgo(ts) {
    const diffMs = Date.now() - ts;
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return '방금 전';
    if (mins < 60) return `${mins}분 전`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}시간 전`;
    return `${Math.floor(hours / 24)}일 전`;
  }

  async function loadNewsKr() {
    if (newsLoadingKr) return;
    newsLoadingKr = true;
    try {
      const feedResults = await Promise.all(KR_FEED_SOURCES.map(loadFeedArticles));
      const merged = feedResults.flat();
      if (merged.length) {
        merged.sort((a, b) => b.ts - a.ts);
        newsItemsKr = merged.slice(0, 50);
        if (view === 'news' && newsSubTab === 'kr') renderNews();
      }
    } catch (e) {
      // keep previous items on failure
    } finally {
      newsLoadingKr = false;
    }
  }

  async function loadNewsGlobal() {
    if (newsLoadingGlobal) return;
    newsLoadingGlobal = true;
    try {
      const feedResults = await Promise.all(GLOBAL_FEED_SOURCES.map(loadFeedArticles));
      const merged = feedResults.flat();
      if (merged.length) {
        merged.sort((a, b) => b.ts - a.ts);
        const top = merged.slice(0, 50);
        await Promise.allSettled(
          top.map(async (item) => {
            item.title = await translateText(item.title);
          }),
        );
        newsItemsGlobal = top;
        if (view === 'news' && newsSubTab === 'global') renderNews();
      }
    } catch (e) {
      // keep previous items on failure
    } finally {
      newsLoadingGlobal = false;
    }
  }

  function econCalDateParts(dateStr) {
    const d = new Date(dateStr + 'T00:00:00+09:00');
    const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' });
    const weekday = `${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}요일`;
    const isToday = dateStr === todayStr;
    const numLabel = `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    return { numLabel, weekdayLabel: isToday ? '오늘' : weekday, isToday, isPast: dateStr < todayStr };
  }

  function renderEconCalendarHtml() {
    const grouped = new Map();
    ECON_CALENDAR.slice()
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
      .forEach((e) => {
        if (!grouped.has(e.date)) grouped.set(e.date, []);
        grouped.get(e.date).push(e);
      });
    const groupsHtml = [...grouped.entries()]
      .map(([date, events]) => {
        const { numLabel, weekdayLabel, isToday, isPast } = econCalDateParts(date);
        return `
          <div class="econ-cal-date-group ${isPast ? 'is-past' : ''}">
            <div class="econ-cal-date-col">
              <div class="econ-cal-date-num ${isToday ? 'today' : ''}">${numLabel}</div>
              <div class="econ-cal-weekday">${weekdayLabel}</div>
            </div>
            <div class="econ-cal-events">
              ${events
                .map(
                  (e) => `
                    <div class="econ-cal-row">
                      <div class="econ-cal-time">${e.time}</div>
                      <div class="econ-cal-title">${e.title}</div>
                      <div class="econ-cal-tag">${e.tag}</div>
                    </div>
                  `,
                )
                .join('')}
            </div>
          </div>
        `;
      })
      .join('');
    return `
      <div class="home-card">
        <div class="portfolio-label">주요 지표 일정</div>
        <div class="econ-cal-list">${groupsHtml}</div>
      </div>
    `;
  }

  // Matches the same session-anchored % every list/watchlist row shows,
  // instead of the raw rolling-24h change -- keeps search results, the
  // add-holding header, and the DCA header consistent with 전체시세.
  function primeSessionOpensForMatches(matches, onDone) {
    const byCat = {};
    matches.forEach(({ t, cat }) => {
      (byCat[cat] = byCat[cat] || []).push(t.symbol);
    });
    Object.keys(byCat).forEach((cat) => ensureSessionOpens(byCat[cat], cat, onDone));
  }

  function renderSearchRow(t, cat) {
    const savedMode = mode;
    mode = cat;
    const changeNum = sessionAnchoredChangePct(t.symbol, cat, Number(t.lastPrice), Number(t.priceChangePercent));
    const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
    const sign = changeNum > 0 ? '+' : '';
    const name = displayName(t.symbol);
    const kr = krName(name);
    mode = savedMode;
    return `
      <div class="row search-row-item" data-symbol="${t.symbol}" data-cat="${cat}">
        <div class="coin">
          <div class="coin-symbol">${name}</div>
          <div class="coin-vol">${CATEGORY_LABELS[cat]}${kr ? ' · ' + kr : ''}</div>
        </div>
        <div class="price">${formatPrice(t.lastPrice)}</div>
        <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
      </div>
    `;
  }

  function performGlobalSearch(query) {
    const q = query.trim().toLowerCase();
    searchClearBtn.hidden = !query;
    if (!q) {
      searchPageListEl.innerHTML = '';
      return;
    }
    const savedMode = mode;
    const matches = [];
    ALL_CATEGORIES.forEach((cat) => {
      mode = cat;
      fullTickers.filter(categoryFilter).forEach((t) => {
        const name = displayName(t.symbol).toLowerCase();
        const kr = (krName(displayName(t.symbol)) || '').toLowerCase();
        if (name.includes(q) || kr.includes(q)) matches.push({ t, cat });
      });
    });
    mode = savedMode;
    matches.sort((a, b) => Number(b.t.quoteVolume) - Number(a.t.quoteVolume));
    searchPageListEl.innerHTML = matches.length
      ? matches.map(({ t, cat }) => renderSearchRow(t, cat)).join('')
      : '<div class="empty">검색 결과가 없습니다</div>';
    primeSessionOpensForMatches(matches, () => performGlobalSearch(searchInputEl.value));
  }

  // Re-renders just the selected stock's live price/change -- called on currency
  // toggle too, so it must never touch the qty/avg-price inputs (would blow away

  function refreshAddHoldingHeaderPrice() {
    if (!addHoldingSelected) return;
    const t = findTicker(addHoldingSelected.symbol);
    if (t) {
      const changePct = sessionAnchoredChangePct(
        addHoldingSelected.symbol,
        addHoldingSelected.cat,

      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';

  let ahoMode = 'qty';
  // Which field the keypad currently types into: 'priceKrw', 'priceUsd', or
  // 'qty' (the qty field doubles as the amount field in 금액 mode).
  let ahoActiveField = 'qty';
  let ahoPriceKrwDigits = '';
  let ahoPriceUsdDigits = '';
  let ahoQtyDigits = '';
  // Once a price field has been hand-edited, typing in the OTHER currency's
  // field stops auto-filling it via FX -- same dirty-tracking convention as
  // the old dual-input version.
  let ahoPriceKrwDirty = false;
  let ahoPriceUsdDirty = false;

  function updateAhoModeButtons() {
    ahoModeToggleEl.querySelectorAll('.aho-mode-text').forEach((el) => {

  function appendAhoDigit(current, key) {
    if (key === 'back') return current.slice(0, -1);
    if (key === '.' && current.includes('.')) return current;
    return current.length < 14 ? current + key : current;
  }

  function formatAhoDigits(digits) {
    if (!digits) return '';
    const [intPart, decPart] = digits.split('.');
    const intFormatted = (intPart || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return decPart !== undefined ? `${intFormatted}.${decPart}` : intFormatted;
  }

  function renderAho() {
    if (!addHoldingSelected) return;
    const caret = '<span class="dca-caret"></span>';

    const krwCaret = ahoActiveField === 'priceKrw' ? caret : '';
    const krwNum = ahoPriceKrwDigits ? formatAhoDigits(ahoPriceKrwDigits) : '0';
    ahoPriceKrwLineEl.innerHTML = `<span class="dca-field-tap" data-field="priceKrw">${krwNum}</span>${krwCaret}<span class="dca-field-tap" data-field="priceKrw">원</span>`;

    const usdCaret = ahoActiveField === 'priceUsd' ? caret : '';
    const usdNum = ahoPriceUsdDigits ? formatAhoDigits(ahoPriceUsdDigits) : '0';
    ahoPriceUsdLineEl.innerHTML = `<span class="dca-field-tap" data-field="priceUsd">$${usdNum}</span>${usdCaret}`;

    const qtyCaret = ahoActiveField === 'qty' ? caret : '';
    if (!ahoQtyDigits) {
      const placeholder = ahoMode === 'qty' ? '몇 주 담을까요?' : '얼마나 담을까요?';
      ahoQtyLineEl.innerHTML = `${qtyCaret}<span class="dca-field-tap dca-dim" data-field="qty">${placeholder}</span>`;
    } else {
      const qtyNum = formatAhoDigits(ahoQtyDigits);
      const unit = ahoMode === 'qty' ? '주' : currency === 'KRW' ? '원' : '달러';
      ahoQtyLineEl.innerHTML = `<span class="dca-field-tap" data-field="qty">${qtyNum}</span>${qtyCaret}<span class="dca-field-tap" data-field="qty">${unit}</span>`;
    }

    const priceNative = currency === 'KRW' ? Number(ahoPriceKrwDigits) || 0 : Number(ahoPriceUsdDigits) || 0;
    const qtyRaw = Number(ahoQtyDigits) || 0;
    const qty = ahoMode === 'qty' ? qtyRaw : priceNative ? qtyRaw / priceNative : 0;
    if (ahoMode === 'qty') {
      ahoTotalRowEl.textContent = `총 ${formatNativeAmount(qty * priceNative)}`;
    } else {
      ahoTotalRowEl.textContent = `${qty.toLocaleString('ko-KR', { maximumFractionDigits: 6 })}주`;
    }
  }

  function selectAddHoldingSymbol(symbol, cat) {
    addHoldingSelected = { symbol, cat };
    addHoldingHeaderSymbolEl.textContent = displayName(symbol);
    refreshAddHoldingHeaderPrice();

    const existing = holdings.find((h) => h.symbol === symbol);
    ahoMode = 'qty';
    // Starts pointed at 평균 매입가 (원) -- that's the first thing to fill in,
    // not quantity.
    ahoActiveField = 'priceKrw';
    if (existing) {
      ahoPriceKrwDigits = String(Math.round(existing.avgPriceKrw));
      ahoPriceUsdDigits = String(Math.round(existing.avgPriceUsd));
      ahoQtyDigits = String(existing.qty);
      // An existing holding's two prices were entered independently -- treat
      // both as dirty so editing one doesn't silently overwrite the other.
      ahoPriceKrwDirty = true;
      ahoPriceUsdDirty = true;
    } else {
      // A fresh entry starts both prices at 0 rather than pre-filled with
      // today's live price -- the user types in what they actually paid.
      ahoPriceKrwDigits = '';
      ahoPriceUsdDigits = '';
      ahoQtyDigits = '';
      ahoPriceKrwDirty = false;
      ahoPriceUsdDirty = false;
    }
    updateAhoModeButtons();
    renderAho();

    addHoldingSearchRowEl.style.display = 'none';
    addHoldingResultsEl.style.display = 'none';
    addHoldingFormEl.hidden = false;
  }

  // A single failed poll is almost always a transient rate-limit blip, not a
  // real outage -- keep showing the last known prices through it instead of
  // flashing an error, and only give up after several in a row.
  let refreshFailStreak = 0;
  const REFRESH_FAIL_THRESHOLD = 4;

  async function refreshAll() {
    try {
      fullTickers = await fetchJson(`${FAPI}/ticker/24hr`);
      refreshFailStreak = 0;
      renderCurrent();
      tickOverlayPrices();
      touchUpdatedAt();
    } catch (e) {
      refreshFailStreak++;
      if (!rawTickers.length && refreshFailStreak >= REFRESH_FAIL_THRESHOLD) {
        listEl.innerHTML = '<div class="empty">시세를 불러오지 못했습니다</div>';
      }
    }
  }

  // renderCurrent() only covers the home/news/watchlist/list tab -- any
  // stacked overlay page showing a price (chart, DCA, portfolio detail,
  // add-holding, search) needs its own refresh here so prices keep ticking
  // no matter what's open on top. Every branch reuses the fullTickers data
  // that just landed above, so none of this costs an extra network call.
  function tickOverlayPrices() {
    if (chartOverlay.classList.contains('open')) {
      updateChartHeaderPrice();
      updateChartMyHolding();
    }
    if (portfolioDetailPageEl.classList.contains('open')) {
      renderPortfolioDetail();
    }
    if (dcaPageEl.classList.contains('open')) {
      renderDcaPage();
    }
    if (addHoldingPageEl.classList.contains('open')) {
      if (addHoldingSelected) refreshAddHoldingHeaderPrice();
      else renderAddHoldingResults(addHoldingSearchInput.value);
    }
    if (addWatchlistPageEl.classList.contains('open')) {
      renderAddWatchlistResults(addWatchlistSearchInput.value);
    }
    if (searchPageEl.classList.contains('open')) {
      performGlobalSearch(searchInputEl.value);
    }

    '1D': { interval: '15m', limit: 96 },
    '1W': { interval: '1h', limit: 168 },
    '3M': { interval: '1d', limit: 90 },
    '1Y': { interval: '1d', limit: 365 },

  };
  const INTERVAL_MS = {
    '15m': 15 * 60 * 1000,
    '1h': 60 * 60 * 1000,
    '1d': 24 * 60 * 60 * 1000,
    '1w': 7 * 24 * 60 * 60 * 1000,

  // Regular trading-session hours per category, in the exchange's own local time.
  // Crypto has no entry -- it trades 24/7, so the 1D chart keeps its plain rolling window.
  // Full-closure dates only (not early-close days) -- hardcoded per calendar
  // year since neither exchange exposes a holiday-calendar API we already call.
  // Needs a yearly top-up.
  const US_MARKET_HOLIDAYS_2026 = new Set([
    '2026-01-01', '2026-01-19', '2026-02-16', '2026-04-03', '2026-05-25',
    '2026-06-19', '2026-07-03', '2026-09-07', '2026-11-26', '2026-12-25',
  ]);
  const KR_MARKET_HOLIDAYS_2026 = new Set([
    '2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18', '2026-03-02',
    '2026-05-01', '2026-05-05', '2026-05-25', '2026-06-03', '2026-07-17',
    '2026-08-17', '2026-09-24', '2026-09-25', '2026-10-05', '2026-10-09',
    '2026-12-25', '2026-12-31',
  ]);

  const MARKET_HOURS = {
    domestic: { tz: 'Asia/Seoul', openMin: 9 * 60, closeMin: 15 * 60 + 30, holidays: KR_MARKET_HOLIDAYS_2026 },
    us: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60, holidays: US_MARKET_HOLIDAYS_2026 },
    leverage: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60, holidays: US_MARKET_HOLIDAYS_2026 },
    index: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60, holidays: US_MARKET_HOLIDAYS_2026 },
  };

  // How far "local wall-clock time in tz" is ahead of UTC, in minutes, at the given instant
  // (handles DST automatically since it's derived from Intl at that exact instant).
  function tzOffsetMinutes(date, tz) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    }).formatToParts(date).reduce((acc, p) => ((acc[p.type] = p.value), acc), {});
    const asUtc = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
    return (asUtc - date.getTime()) / 60000;
  }

  // Resolves the most recent regular session for `cat` relative to `now`: today's
  // session (in progress or just-closed) if today is a trading day and we're past
  // open, otherwise the previous weekday's full session. No holiday calendar --
  // holidays will incorrectly read as a trading day, which is an accepted gap.
  function isTradingDay(cfg, weekdayIdx, dateStr) {
    if (weekdayIdx === 0 || weekdayIdx === 6) return false;
    if (cfg.holidays && cfg.holidays.has(dateStr)) return false;
    return true;
  }

  function getRegularSession(cat, now) {
    const cfg = MARKET_HOURS[cat];
    if (!cfg) return null;
    // Round to the minute: tzOffsetMinutes truncates to whole seconds internally,
    // so an un-rounded `now` makes session.start jitter by sub-second amounts
    // across calls -- and since that value is used as a cache key elsewhere,
    // that jitter alone was enough to make every call look like a cache miss.
    now = new Date(Math.floor(now.getTime() / 60000) * 60000);

    // Walk backward day by day until landing on a trading day (skips weekends
    // and the hardcoded holiday list, including runs of consecutive closures
    // like Lunar New Year) -- today only counts if `now` is at-or-past its open.
    for (let dayOffset = 0; dayOffset <= 10; dayOffset++) {
      const probe = new Date(now.getTime() - dayOffset * 86400000);
      const offsetMin = tzOffsetMinutes(probe, cfg.tz);
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: cfg.tz, hourCycle: 'h23', weekday: 'short',
        year: 'numeric', month: '2-digit', day: '2-digit',
      }).formatToParts(probe).reduce((acc, p) => ((acc[p.type] = p.value), acc), {});
      const weekdayIdx = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.weekday);
      const y = +parts.year, m = +parts.month, d = +parts.day;
      const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (!isTradingDay(cfg, weekdayIdx, dateStr)) continue;

      const sessionOpen = Date.UTC(y, m - 1, d, 0, 0, 0) + cfg.openMin * 60000 - offsetMin * 60000;
      if (dayOffset === 0 && now.getTime() < sessionOpen) continue; // today, but before open

      const sessionClose = Date.UTC(y, m - 1, d, 0, 0, 0) + cfg.closeMin * 60000 - offsetMin * 60000;
      return {
        start: sessionOpen,
        end: Math.max(Math.min(now.getTime(), sessionClose), sessionOpen + 60000),
        fullEnd: sessionClose,
      };
    }
    return null;
  }

  // Walks forward from `afterMs` to the next trading day's open (skipping
  // weekends and holidays) -- used once today's session has closed, to extend
  // the 1D chart's time axis out to the next open instead of stopping dead at
  // today's close.
  function getNextSessionStart(cat, afterMs) {
    const cfg = MARKET_HOURS[cat];
    if (!cfg) return null;
    for (let i = 1; i <= 10; i++) {
      const probe = new Date(afterMs + i * 86400000);
      const offsetMin = tzOffsetMinutes(probe, cfg.tz);
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: cfg.tz, hourCycle: 'h23', weekday: 'short',
        year: 'numeric', month: '2-digit', day: '2-digit',
      }).formatToParts(probe).reduce((acc, p) => ((acc[p.type] = p.value), acc), {});
      const weekdayIdx = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.weekday);
      const y = +parts.year, m = +parts.month, d = +parts.day;
      const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (!isTradingDay(cfg, weekdayIdx, dateStr)) continue;
      return Date.UTC(y, m - 1, d, 0, 0, 0) + cfg.openMin * 60000 - offsetMin * 60000;
    }
    return null;
  }

  // "Since regular-session-open" change% for list rows, falling back to Binance's
  // rolling 24h priceChangePercent (crypto, or while the open print hasn't loaded yet).
  function sessionAnchoredChangePct(symbol, cat, lastPrice, fallbackPct) {
    if (!MARKET_HOURS[cat]) return fallbackPct;
    const session = getRegularSession(cat, new Date());
    if (!session) return fallbackPct;
    const openPrice = sessionOpenCache[symbol + '|' + session.start];
    if (openPrice == null) return fallbackPct;
    return ((lastPrice - openPrice) / openPrice) * 100;
  }

  // Fetches each symbol's actual opening print for the current session once (cached
  // for the rest of that session), throttled so a ~70-symbol tab doesn't fire 70
  // concurrent requests at once. Re-renders whatever's on screen as results land --
  // defaults to the main list, but callers showing a symbol somewhere else
  // (search results, a single selected stock) pass their own refresh.
  async function ensureSessionOpens(symbols, cat, onDone) {
    onDone = onDone || renderCurrent;
    if (!MARKET_HOURS[cat] || !symbols.length) return;
    const session = getRegularSession(cat, new Date());
    if (!session) return;
    const key = session.start;
    const missing = symbols.filter((s) => sessionOpenCache[s + '|' + key] == null);
    if (!missing.length) return;
    let idx = 0;
    async function worker() {
      while (idx < missing.length) {
        const symbol = missing[idx++];
        try {
          const kl = await fetchJson(`${FAPI}/klines?symbol=${symbol}&interval=15m&startTime=${key}&limit=1`);
          if (kl.length) sessionOpenCache[symbol + '|' + key] = Number(kl[0][1]);
        } catch (e) {
          // leave uncached -- row keeps showing the rolling-24h fallback
        }
      }
    }
    await Promise.all(Array.from({ length: Math.min(6, missing.length) }, worker));
    onDone();
  }

  let currentSymbol = null;
  let currentCat = null;
  let currentRange = '1D';
  let chartCloses = [];
  let chartTimes = [];
  let chartRealStartIdx = 0;
  let chartTimeDomain = null;
  let chartSessionBoundary = null;
  let chartRefValue = null;
  let scrubbing = false;

  function drawChart(closes, times, hoverIdx, realStartIdx, timeDomain, refValue, sessionBoundary) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const startIdx = Math.max(0, Math.min(closes.length - 1, realStartIdx || 0));
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= (refValue != null ? refValue : closes[startIdx]);
    const color = up ? '#ff5c5c' : '#3182f6';
    const padTop = 56;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    // A regular-session 1D chart reserves the full open-to-close width even while the
    // session is still in progress -- real candles only occupy the elapsed portion
    // (mapped by actual time, not by index), leaving the rest of the day blank.
    const points = closes.map((c, i) => {
      const x = timeDomain
        ? ((times[i] - timeDomain[0]) / (timeDomain[1] - timeDomain[0])) * w
        : (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[startIdx][0], points[startIdx][1]);
    for (let i = startIdx; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[startIdx][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    if (startIdx > 0) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 0; i <= startIdx; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.strokeStyle = '#8b95a180';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Binance's tokenized-stock symbols keep trading (and moving) outside regular
    // hours too -- the colored stroke stops at the session boundary, but real
    // after-hours candles past it still get drawn, just in gray like the rest
    // of the "market closed" styling, instead of being dropped on the floor.
    let sessionEndIdx = points.length - 1;
    if (sessionBoundary != null) {
      const firstAfterIdx = times.findIndex((t) => t > sessionBoundary);
      if (firstAfterIdx !== -1) sessionEndIdx = Math.max(startIdx, firstAfterIdx - 1);
    }

    ctx.beginPath();
    ctx.moveTo(points[startIdx][0], points[startIdx][1]);
    for (let i = startIdx; i <= sessionEndIdx; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    if (sessionEndIdx < points.length - 1) {
      ctx.beginPath();
      ctx.moveTo(points[sessionEndIdx][0], points[sessionEndIdx][1]);
      for (let i = sessionEndIdx; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.strokeStyle = '#8b95a180';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // Mark the live/last-real point with a dot. No flat placeholder drawn past
    // it anymore -- the chart just ends where the real data does.
    const lastPt = points[points.length - 1];
    if (timeDomain && lastPt[0] < w - 1) {
      ctx.beginPath();
      ctx.arc(lastPt[0], lastPt[1], 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#f2f4f6';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (hoverIdx != null && points[hoverIdx]) {
      const [hx] = points[hoverIdx];
      ctx.save();
      ctx.strokeStyle = 'rgba(25,31,40,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, 0);
      ctx.lineTo(hx, h);
      ctx.stroke();
      ctx.restore();
    }
  }

  function formatScrubDate(ts) {
    const d = new Date(ts);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (currentRange === '1D' || currentRange === '1W') {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi}`;
    }
    return `${d.getFullYear()}.${mm}.${dd}`;
  }

  function scrubAt(clientX) {
    if (chartCloses.length < 2) return;
    const rect = chartCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    let idx;
    let hx;
    if (chartTimeDomain) {
      // Time-proportional mapping -- find the real candle nearest the scrubbed
      // pixel's corresponding time (scrubbing past the last real point just
      // re-selects it, since there's no data in the empty remaining session).
      const [ds, de] = chartTimeDomain;
      const targetTime = ds + (x / rect.width) * (de - ds);
      idx = 0;
      let best = Infinity;
      for (let i = 0; i < chartTimes.length; i++) {
        const diff = Math.abs(chartTimes[i] - targetTime);
        if (diff < best) {
          best = diff;
          idx = i;
        }
      }
      hx = ((chartTimes[idx] - ds) / (de - ds)) * rect.width;
    } else {
      idx = Math.round((x / rect.width) * (chartCloses.length - 1));
      idx = Math.max(0, Math.min(chartCloses.length - 1, idx));
      hx = (idx / (chartCloses.length - 1)) * rect.width;
    }
    drawChart(chartCloses, chartTimes, idx, chartRealStartIdx, chartTimeDomain, chartRefValue, chartSessionBoundary);
    scrubDateEl.textContent = formatScrubDate(chartTimes[idx]);
    scrubPriceEl.textContent = formatPrice(chartCloses[idx]);
    chartScrubLabelEl.style.display = 'block';
    const lw = chartScrubLabelEl.offsetWidth;
    const left = Math.max(4, Math.min(rect.width - lw - 4, hx - lw / 2));
    chartScrubLabelEl.style.left = `${left}px`;
  }

  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    chartScrubLabelEl.style.display = 'none';
    drawChart(chartCloses, chartTimes, null, chartRealStartIdx, chartTimeDomain, chartRefValue, chartSessionBoundary);
  }

  chartCanvas.addEventListener('mousedown', (e) => {
    scrubbing = true;
    scrubAt(e.clientX);
  });
  chartCanvas.addEventListener('mousemove', (e) => {
    if (scrubbing) scrubAt(e.clientX);
  });
  window.addEventListener('mouseup', endScrub);
  chartCanvas.addEventListener('touchstart', (e) => {
    scrubbing = true;
    scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchmove', (e) => {
    if (scrubbing) scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchend', endScrub);

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    chartScrubLabelEl.style.display = 'none';
    const { interval, limit } = RANGES[currentRange];
    const session = currentRange === '1D' ? getRegularSession(currentCat, new Date()) : null;
    // Binance's tokenized-stock symbols actually keep trading (and moving) around
    // the clock, same as any crypto pair -- the regular session hours only bound
    // when the chart is drawn in color. Once today's session has closed, stretch
    // the fetch out to tomorrow's open (capped at "now") so the after-hours
    // portion shows real price action instead of a flat placeholder.
    let domainEnd = session ? session.fullEnd : null;
    if (session && Date.now() >= session.fullEnd) {
      domainEnd = getNextSessionStart(currentCat, session.fullEnd) || session.fullEnd;
    }
    const fetchEnd = session ? Math.min(Date.now(), domainEnd) : null;
    const url = session
      ? `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&startTime=${session.start}&endTime=${fetchEnd}&limit=1500`
      : `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`;
    try {
      const klines = await fetchJson(url);
      let closes = klines.map((k) => Number(k[4]));
      let times = klines.map((k) => Number(k[0]));
      // For a session-anchored 1D chart, use the first candle's own open print
      // (not its close) so this matches the session's actual opening price.
      const first = session && klines.length ? Number(klines[0][1]) : closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = formatPrice(last);
      chartPriceSecondaryEl.textContent = formatSecondaryPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;

      // Symbols listed more recently than the selected range (e.g. a 6-month-old
      // ETF on a 5Y chart) get fewer candles back than `limit` -- pad the front
      // with the listing price so the time axis still spans the full range
      // instead of the real data stretching to fill the whole chart width.
      // Skipped for session-anchored 1D fetches: a session simply in progress
      // (not yet at close) isn't the same thing as the symbol being too new.
      let realStartIdx = 0;
      if (!session && closes.length < limit && closes.length > 0) {
        const padCount = limit - closes.length;
        const stepMs = INTERVAL_MS[interval] || 0;
        const padClosesArr = new Array(padCount).fill(closes[0]);
        const padTimesArr = Array.from({ length: padCount }, (_, i) => times[0] - (padCount - i) * stepMs);
        closes = padClosesArr.concat(closes);
        times = padTimesArr.concat(times);
        realStartIdx = padCount;
      }

      chartCloses = closes;
      chartTimes = times;
      chartRealStartIdx = realStartIdx;
      chartTimeDomain = session ? [session.start, domainEnd] : null;
      // Where regular-session hours end within the fetched data, so drawChart
      // can color that point on forward gray even though it's real price data.
      chartSessionBoundary = session ? session.fullEnd : null;
      // Same value the header %/sign is computed from, so the line's up/down
      // color can't disagree with the sign shown above it.
      chartRefValue = first;

      drawChart(closes, times, null, realStartIdx, chartTimeDomain, chartRefValue, chartSessionBoundary);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol, cat) {
    currentSymbol = symbol;
    currentCat = cat;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    const name = displayName(symbol);
    chartSymbolEl.textContent = name;
    const kr = krName(name, cat);
    chartSymbolKrEl.textContent = kr || '';
    chartSymbolKrEl.style.display = kr ? '' : 'none';
    chartOverlay.classList.add('open');
    updateChartHeart();
    updateChartMyHolding();
    loadChart();
  }

  // Cheap per-tick price refresh for the chart header -- reuses the already-
  // fetched fullTickers data (no network call) so the number can keep ticking
  // every second without re-fetching klines or redrawing the chart line.
  function updateChartHeaderPrice() {
    const t = findTicker(currentSymbol);
    if (!t || chartRefValue == null) return;
    const last = Number(t.lastPrice);
    const changePct = ((last - chartRefValue) / chartRefValue) * 100;
    const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
    const sign = changePct > 0 ? '+' : '';
    chartPriceEl.textContent = formatPrice(last);
    chartPriceSecondaryEl.textContent = formatSecondaryPrice(last);
    chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
    chartChangeEl.className = `chart-change ${cls}`;
  }

  function updateChartMyHolding() {
    const h = holdings.find((x) => x.symbol === currentSymbol);
    if (!h) {
      chartMyHoldingSectionEl.hidden = true;
      return;
    }
    const s = holdingStats(h);
    const pnlCls = s.pnlNative > 0 ? 'up' : s.pnlNative < 0 ? 'down' : '';
    const pnlSign = s.pnlNative > 0 ? '+' : s.pnlNative < 0 ? '-' : '';
    const avg = formatAvgPricePair(h);
    chartMyHoldingListEl.innerHTML = `
      <div class="chart-stat-row">
        <div class="chart-stat-label">1주 평균</div>
        <div class="chart-stat-value">${avg.primary}<div class="chart-stat-sub">${avg.secondary}</div></div>
      </div>
      <div class="chart-stat-row">
        <div class="chart-stat-label">보유 수량</div>
        <div class="chart-stat-value">${h.qty.toLocaleString('ko-KR')}주</div>
      </div>
      <div class="chart-stat-row">
        <div class="chart-stat-label">총 금액</div>
        <div class="chart-stat-value">${formatNativeAmount(s.valueNative)}<div class="chart-stat-sub ${pnlCls}">${pnlSign}${formatNativeAmount(Math.abs(s.pnlNative))} (${pnlSign}${Math.abs(s.pnlPct).toFixed(1)}%)</div></div>
      </div>
    `;
    chartMyHoldingSectionEl.hidden = false;
  }

  // Live market price, used as the default basis for the hypothetical extra
  // purchase. The user can override it (dcaPriceDigits) to ask "what if I'd
  // bought at X" instead of "if I bought more right now."
  function getLivePriceNative() {
    const t = findTicker(currentSymbol);
    const lastPriceUsd = t ? Number(t.lastPrice) : 0;
    return { usd: lastPriceUsd, native: currency === 'KRW' && krwRate ? lastPriceUsd * krwRate : lastPriceUsd };
  }

  // Resolves the price actually used for the calculation: the user's custom
  // override if they've touched that field, otherwise today's live price.
  // Always returns both currencies so applyDca can keep avgPriceKrw/avgPriceUsd
  // consistent regardless of which currency the override was entered in.
  function getDcaPricePair() {
    if (dcaPriceDigitsTouched) {
      const native = Number(dcaPriceDigits) || 0;
      return currency === 'KRW'
        ? { native, krw: native, usd: krwRate ? native / krwRate : 0 }
        : { native, usd: native, krw: krwRate ? native * krwRate : 0 };
    }
    const live = getLivePriceNative();
    return { native: live.native, usd: live.usd, krw: krwRate ? live.usd * krwRate : 0 };
  }

  let dcaMode = 'qty';
  // Raw digits typed on the custom keypad (whole numbers only, no native
  // keyboard/decimal entry -- mirrors the reference app's keypad, which has
  // no decimal key either). dcaRawDigits drives the qty/amount field;
  // dcaPriceDigits drives the optional custom-price override (qty mode only).
  // dcaActiveField says which of the two the keypad currently types into.
  let dcaRawDigits = '';
  let dcaPriceDigits = '';
  // Before either field is touched, it just displays a live value (example
  // qty/amount, or today's market price) -- not a real typed value. Once the
  // user presses any key (including delete) in that field, it switches to
  // showing/using exactly what they've typed, even if that's now empty (0).
  let dcaRawDigitsTouched = false;
  let dcaPriceDigitsTouched = false;
  let dcaActiveField = 'qty';

  function updateDcaModeButtons() {
    dcaModeToggleEl.querySelectorAll('.dca-mode-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === dcaMode);
    });
  }

  function openDcaPage() {
    const h = holdings.find((x) => x.symbol === currentSymbol);
    if (!h) return;
    dcaMode = 'qty';
    dcaRawDigits = '';
    dcaPriceDigits = '';
    dcaRawDigitsTouched = false;
    dcaPriceDigitsTouched = false;
    dcaActiveField = 'qty';
    updateDcaModeButtons();
    dcaPageSymbolEl.textContent = displayName(currentSymbol);
    dcaPageEl.classList.add('open');
    renderDcaPage();
  }

  function closeDcaPage() {
    dcaPageEl.classList.remove('open');
  }

  // The caret sits right before the unit character (원/주), not after the
  // whole number+unit block -- so every field is split into a number part
  // and a unit part, each independently tappable (same data-field) with the
  // caret dropped in between when that field is the active one.
  function renderDcaSentence(priceNative) {
    const caret = '<span class="dca-caret"></span>';
    if (dcaMode === 'qty') {
      const priceCaret = dcaActiveField === 'price' ? caret : '';
      let priceHtml;
      if (currency === 'KRW') {
        const priceNum = Math.round(priceNative).toLocaleString('ko-KR');
        priceHtml = `<span class="dca-field-tap" data-field="price">${priceNum}</span>${priceCaret}<span class="dca-field-tap" data-field="price">원</span>`;
      } else {
        // USD prices lead with "$" (no trailing unit to anchor the caret
        // before), so it just sits after the whole formatted number here.
        priceHtml = `<span class="dca-field-tap" data-field="price">${formatNativeAmount(priceNative)}</span>${priceCaret}`;
      }
      const qtyCaret = dcaActiveField === 'qty' ? caret : '';
      const qtyDisplay = dcaEffectiveRawInput().toLocaleString('ko-KR');
      dcaSentenceEl.innerHTML = `
        <div class="dca-sentence-line">${priceHtml}<span class="dca-dim">으로</span></div>
        <div class="dca-sentence-line"><span class="dca-field-tap" data-field="qty">${qtyDisplay}</span>${qtyCaret}<span class="dca-field-tap" data-field="qty">주</span><span class="dca-dim"> 더 구매하면</span></div>
      `;
    } else {
      if (currency === 'KRW') {
        const amtDisplay = dcaEffectiveRawInput().toLocaleString('ko-KR');
        dcaSentenceEl.innerHTML = `
          <div class="dca-sentence-line"><span class="dca-dim">지금 </span><span class="dca-field-tap" data-field="amount">${amtDisplay}</span>${caret}<span class="dca-field-tap" data-field="amount">원</span></div>
          <div class="dca-sentence-line"><span class="dca-dim">더 구매하면</span></div>
        `;
      } else {
        // USD leads with "$" like the price field -- no trailing unit to put
        // the caret before, so it just sits after the number.
        const amtDisplay = dcaEffectiveRawInput().toLocaleString('en-US');
        dcaSentenceEl.innerHTML = `
          <div class="dca-sentence-line"><span class="dca-dim">지금 </span><span class="dca-field-tap" data-field="amount">$${amtDisplay}</span>${caret}</div>
          <div class="dca-sentence-line"><span class="dca-dim">더 구매하면</span></div>
        `;
      }
    }
  }

  // Before the qty/amount field is touched, it shows (and the totals below
  // use) an example number instead of freezing at 0 -- once touched, it's
  // exactly what's been typed, down to 0 if fully deleted.
  function dcaEffectiveRawInput() {
    if (dcaRawDigitsTouched) return Number(dcaRawDigits) || 0;
    if (dcaMode === 'qty') return 10;
    return currency === 'KRW' ? 10000 : 10;
  }

  function renderDcaPage() {
    const h = holdings.find((x) => x.symbol === currentSymbol);
    if (!h) return;
    const t = findTicker(currentSymbol);
    const changePct = t
      ? sessionAnchoredChangePct(currentSymbol, currentCat, Number(t.lastPrice), Number(t.priceChangePercent))
      : 0;
    const changeCls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
    const changeSign = changePct > 0 ? '+' : '';
    dcaPagePriceEl.innerHTML = `${formatNativeAmount(getLivePriceNative().native)} <span class="${changeCls}">${changeSign}${changePct.toFixed(2)}%</span>`;
    if (t) ensureSessionOpens([currentSymbol], currentCat, renderDcaPage);

    const { native: priceNative } = getDcaPricePair();
    renderDcaSentence(priceNative);

    const rawInput = dcaEffectiveRawInput();
    let addQty, totalAmount;
    if (dcaMode === 'qty') {
      addQty = rawInput;
      totalAmount = addQty * priceNative;
      dcaTotalRowEl.textContent = `총 ${formatNativeAmount(totalAmount)}`;
    } else {
      totalAmount = rawInput;
      addQty = priceNative ? totalAmount / priceNative : 0;
      dcaTotalRowEl.textContent = `${addQty.toLocaleString('ko-KR', { maximumFractionDigits: 6 })}주`;
    }

    const avgPriceNative = currency === 'KRW' ? h.avgPriceKrw || 0 : h.avgPriceUsd || 0;
    const curPct = avgPriceNative ? ((priceNative - avgPriceNative) / avgPriceNative) * 100 : 0;
    const curSign = curPct > 0 ? '+' : '';
    dcaCurPctEl.textContent = `${curSign}${curPct.toFixed(1)}%`;
    dcaCurPctEl.className = `dca-compare-pct ${curPct > 0 ? 'up' : curPct < 0 ? 'down' : ''}`;
    dcaCurPriceEl.textContent = formatNativeAmount(avgPriceNative);

    if (addQty > 0) {
      const newQty = h.qty + addQty;
      const newTotalCost = h.qty * avgPriceNative + totalAmount;
      const newAvg = newQty ? newTotalCost / newQty : avgPriceNative;
      const newPct = newAvg ? ((priceNative - newAvg) / newAvg) * 100 : 0;
      const newSign = newPct > 0 ? '+' : '';
      dcaNewPctEl.textContent = `${newSign}${newPct.toFixed(1)}%`;
      dcaNewPctEl.className = `dca-compare-pct ${newPct > 0 ? 'up' : newPct < 0 ? 'down' : ''}`;
      dcaNewPriceEl.textContent = formatNativeAmount(newAvg);
    } else {
      dcaNewPctEl.textContent = dcaCurPctEl.textContent;
      dcaNewPctEl.className = dcaCurPctEl.className;
      dcaNewPriceEl.textContent = dcaCurPriceEl.textContent;
    }
  }

  function applyDca() {
    const h = holdings.find((x) => x.symbol === currentSymbol);
    if (!h) return;
    const { usd: priceUsd, krw: priceKrw, native: priceNative } = getDcaPricePair();
    const rawInput = Number(dcaRawDigits) || 0;
    const addQty = dcaMode === 'qty' ? rawInput : priceNative ? rawInput / priceNative : 0;
    if (addQty <= 0) return;
    const newQty = h.qty + addQty;
    const newTotalKrw = h.qty * (h.avgPriceKrw || 0) + addQty * priceKrw;
    const newTotalUsd = h.qty * (h.avgPriceUsd || 0) + addQty * priceUsd;
    h.avgPriceKrw = newQty ? newTotalKrw / newQty : h.avgPriceKrw;
    h.avgPriceUsd = newQty ? newTotalUsd / newQty : h.avgPriceUsd;
    h.qty = newQty;
    saveHoldings();
    closeDcaPage();
    updateChartMyHolding();
    if (mode === 'home') renderHome();
    if (portfolioDetailPageEl.classList.contains('open')) renderPortfolioDetail();
  }

  chartDcaBtn.addEventListener('click', openDcaPage);
  dcaCloseEl.addEventListener('click', closeDcaPage);
  dcaModeToggleEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.dca-mode-btn');
    if (!btn || btn.dataset.mode === dcaMode) return;
    dcaMode = btn.dataset.mode;
    updateDcaModeButtons();
    dcaRawDigits = '';
    dcaRawDigitsTouched = false;
    dcaActiveField = dcaMode === 'amount' ? 'amount' : 'qty';
    renderDcaPage();
  });
  dcaSentenceEl.addEventListener('click', (e) => {
    const el = e.target.closest('.dca-field-tap');

    dcaActiveField = el.dataset.field;

  dcaKeypadEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.dca-keypad-btn');
    if (!btn) return;
    const key = btn.dataset.key;
    const editingPrice = dcaActiveField === 'price';
    const touched = editingPrice ? dcaPriceDigitsTouched : dcaRawDigitsTouched;
    let current = editingPrice ? dcaPriceDigits : dcaRawDigits;
    if (key === 'back' && !touched) {
      // Backspacing a still-"live" field (digit keys already start fresh
      // from empty, as before) picks up what's actually on screen -- the
      // example qty/amount, or today's price -- so delete has something to
      // remove instead of silently no-op'ing on an empty string.
      current = String(editingPrice ? Math.round(getDcaPricePair().native) : dcaEffectiveRawInput());
    }
    const next = key === 'back' ? current.slice(0, -1) : current.length < 12 ? current + key : current;
    if (editingPrice) {
      dcaPriceDigits = next;
      dcaPriceDigitsTouched = true;
    } else {
      dcaRawDigits = next;
      dcaRawDigitsTouched = true;
    }
    renderDcaPage();
  });
  dcaApplyBtn.addEventListener('click', applyDca);
  attachSwipeBack(dcaPageEl, closeDcaPage, null, chartInnerEl);

  [

  // Shared by the back button and the swipe-back gesture: steps from the

  function resetBehindTransform(behindEl) {
    behindEl.style.transition = 'none';
    behindEl.style.transform = '';
  }

  // Shared edge-swipe-to-close gesture: the overlay follows the finger and
  // the page underneath parallaxes in, same as a native back transition.
  // excludeSelector lets a specific child area (e.g. the chart canvas, which
  // has its own horizontal drag-to-scrub gesture) opt out of starting a swipe.
  // behindEl is whatever visually sits "under" this overlay -- the home wrap
  // for a top-level page, but a parent overlay's own inner content (e.g.
  // chart-inner, for the DCA page stacked on top of the chart) when this
  // overlay was opened from within another one.
  function attachSwipeBack(overlayEl, closeFn, excludeSelector, behindEl) {
    behindEl = behindEl || wrapEl;
    let swipeX = 0;
    let swipeY = 0;
    let swipeStart = 0;
    let tracking = false;
    let dragging = false;

    overlayEl.addEventListener('touchstart', (e) => {
      if (excludeSelector && e.target.closest(excludeSelector)) {
        tracking = false;
        return;
      }
      tracking = true;
      dragging = false;
      swipeX = e.touches[0].clientX;
      swipeY = e.touches[0].clientY;
      swipeStart = Date.now();
      overlayEl.style.transition = 'none';
    }, { passive: true });

    overlayEl.addEventListener('touchmove', (e) => {
      if (!tracking) return;
      const dx = e.touches[0].clientX - swipeX;
      const dy = e.touches[0].clientY - swipeY;
      if (!dragging) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          tracking = false;
          return;
        }
        dragging = true;
        behindEl.style.transition = 'none';
        // WebKit's native text caret doesn't reliably track a CSS transform
        // applied to an ancestor during an active touch-drag -- it visibly
        // detaches from the input and drifts on its own. Blurring whatever's
        // focused drops the caret before the drag transform kicks in below.
        if (document.activeElement && overlayEl.contains(document.activeElement)) {
          document.activeElement.blur();
        }
      }
      e.preventDefault();
      overlayEl.style.transform = `translateX(${dx}px)`;
      const progress = Math.min(Math.abs(dx) / window.innerWidth, 1);
      const dir = dx > 0 ? 1 : -1;
      behindEl.style.transform = `translateX(${-dir * (1 - progress) * 30}%)`;
    }, { passive: false });

    overlayEl.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - swipeX;
      const dy = e.changedTouches[0].clientY - swipeY;
      const elapsed = Date.now() - swipeStart;
      const velocity = Math.abs(dx) / Math.max(elapsed, 1);
      overlayEl.style.transition = 'transform 0.25s ease';
      behindEl.style.transition = 'transform 0.25s ease';
      if (dragging && Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > 90 || velocity > 0.5)) {
        const dir = dx > 0 ? 1 : -1;
        overlayEl.style.transform = `translateX(${dir * 100}%)`;
        behindEl.style.transform = 'translateX(0)';
        setTimeout(() => {
          closeFn();
          overlayEl.style.transition = 'none';
          overlayEl.style.transform = '';
          resetBehindTransform(behindEl);
        }, 250);
      } else {
        overlayEl.style.transform = 'translateX(0)';
        behindEl.style.transform = 'translateX(0)';
        if (dragging) setTimeout(() => resetBehindTransform(behindEl), 250);
      }
      dragging = false;
    }, { passive: true });
  }

  attachSwipeBack(chartOverlay, closeChart, '.chart-canvas-wrap');
  attachSwipeBack(newsDetailPageEl, closeNewsDetail, null);
  attachSwipeBack(portfolioDetailPageEl, closePortfolioDetail, null);
  attachSwipeBack(addHoldingPageEl, handleAddHoldingBack, null, portfolioDetailInnerEl);
  attachSwipeBack(searchPageEl, closeSearch, null);
  attachSwipeBack(addWatchlistPageEl, closeAddWatchlist, null);

  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update().catch(() => {}));
      }
    });
  }
</script>

</html>

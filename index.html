<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 시세</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .updated {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child {
    border-bottom: none;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <div class="title">거래량 상위 <span>TOP 20</span></div>
      <div class="updated" id="updatedAt">불러오는 중...</div>
    </div>
    <div class="list" id="list">
      <div class="empty">불러오는 중...</div>
    </div>
    <div class="footer-note">바이낸스(Binance) 공개 API 기준 · USDT 마켓 · 5초마다 갱신</div>
  </div>

<script>
  const TOP_N = 20;
  const PRICE_REFRESH_MS = 5000;
  const RANK_REFRESH_MS = 60000;

  const listEl = document.getElementById('list');
  const updatedAtEl = document.getElementById('updatedAt');

  let topSymbols = [];

  function formatPrice(p) {
    const n = Number(p);
    if (n >= 100) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return n.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  function formatVolume(v) {
    const n = Number(v);
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  }

  function render(tickers) {
    listEl.innerHTML = tickers
      .map((t, i) => {
        const changeNum = Number(t.priceChangePercent);
        const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
        const sign = changeNum > 0 ? '+' : '';
        const coin = t.symbol.replace(/USDT$/, '');
        return `
          <div class="row">
            <div class="rank">${i + 1}</div>
            <div class="coin">
              <div class="coin-symbol">${coin}</div>
              <div class="coin-vol">거래대금 ${formatVolume(t.quoteVolume)}</div>
            </div>
            <div class="price">$${formatPrice(t.lastPrice)}</div>
            <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
          </div>
        `;
      })
      .join('');
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    return res.json();
  }

  async function refreshRanking() {
    try {
      const all = await fetchJson('https://api.binance.com/api/v3/ticker/24hr');
      const usdt = all.filter((t) => t.symbol.endsWith('USDT') && !t.symbol.startsWith('USD'));
      usdt.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
      const top = usdt.slice(0, TOP_N);
      topSymbols = top.map((t) => t.symbol);
      render(top);
      touchUpdatedAt();
    } catch (e) {
      if (!topSymbols.length) {
        listEl.innerHTML = '<div class="empty">시세를 불러오지 못했습니다</div>';
      }
    }
  }

  async function refreshPrices() {
    if (!topSymbols.length) return;
    try {
      const symbolsParam = encodeURIComponent(JSON.stringify(topSymbols));
      const tickers = await fetchJson(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
      const order = new Map(topSymbols.map((s, i) => [s, i]));
      tickers.sort((a, b) => order.get(a.symbol) - order.get(b.symbol));
      render(tickers);
      touchUpdatedAt();
    } catch (e) {
      // keep showing last known prices on transient failure
    }
  }

  function touchUpdatedAt() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    updatedAtEl.textContent = `${hh}:${mm}:${ss} 기준`;
  }

  refreshRanking();
  setInterval(refreshPrices, PRICE_REFRESH_MS);
  setInterval(refreshRanking, RANK_REFRESH_MS);
</script>

</body>
</html>

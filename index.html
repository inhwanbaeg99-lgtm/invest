<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 시세</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .updated {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .mode-tab {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: #1a1d22;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  .chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .chart-overlay.open {
    display: flex;
  }
  .chart-modal {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  .chart-modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .chart-symbol {
    font-size: 18px;
    font-weight: 800;
  }
  .chart-close {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: #1a1d22;
    color: var(--ink-sub);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .chart-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }
  .chart-price {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chart-change {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-change.up { color: var(--up); }
  .chart-change.down { color: var(--down); }
  .chart-canvas-wrap {
    position: relative;
    height: 180px;
  }
  #chartCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-sub);
    font-size: 13px;
  }
  .chart-ranges {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }
  .chart-range-btn {
    flex: 1;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: #1a1d22;
    color: var(--ink-sub);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .chart-range-btn.active {
    background: var(--accent);
    color: #04201d;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <div class="title">거래량 상위 <span>TOP 20</span></div>
      <div class="updated" id="updatedAt">불러오는 중...</div>
    </div>
    <div class="mode-tabs" id="modeTabs">
      <button type="button" class="mode-tab active" data-mode="coin">코인</button>
      <button type="button" class="mode-tab" data-mode="stock">주식</button>
    </div>
    <div class="list" id="list">
      <div class="empty">불러오는 중...</div>
    </div>
    <div class="footer-note" id="footerNote">바이낸스(Binance) 공개 API 기준 · USDT 마켓 · 5초마다 갱신</div>
  </div>

  <div class="chart-overlay" id="chartOverlay">
    <div class="chart-modal">
      <div class="chart-modal-header">
        <div class="chart-symbol" id="chartSymbol">BTC</div>
        <button type="button" class="chart-close" id="chartClose" aria-label="닫기">✕</button>
      </div>
      <div class="chart-price-row">
        <div class="chart-price" id="chartPrice">$0</div>
        <div class="chart-change" id="chartChange">+0.00%</div>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="chartCanvas"></canvas>
        <div class="chart-loading" id="chartLoading">불러오는 중...</div>
      </div>
      <div class="chart-ranges" id="chartRanges">
        <button type="button" class="chart-range-btn active" data-range="1D">1일</button>
        <button type="button" class="chart-range-btn" data-range="1W">1주</button>
        <button type="button" class="chart-range-btn" data-range="1M">1개월</button>
      </div>
    </div>
  </div>

<script>
  const TOP_N = 20;
  const PRICE_REFRESH_MS = 5000;
  const RANK_REFRESH_MS = 60000;

  const listEl = document.getElementById('list');
  const updatedAtEl = document.getElementById('updatedAt');
  const footerNoteEl = document.getElementById('footerNote');
  const modeTabsEl = document.getElementById('modeTabs');

  // 바이낸스에 상장된 토큰화 주식(미국 증시 휴장일/주말에도 거래 가능) 심볼
  const STOCK_BASES = [
    'AAPLB', 'TSLAB', 'NVDAB', 'MSFTB', 'METAB', 'GOOGLB', 'AMZNB', 'NFLXB', 'ORCLB', 'ADBEB',
    'CRMB', 'IBMB', 'INTCB', 'QCOMB', 'AVGOB', 'AMDB', 'AMATB', 'ASMLB', 'TSMB', 'DELLB',
    'PYPLB', 'GSB', 'BABAB', 'COINB', 'MSTRB', 'HOODB', 'PLTRB', 'CRWDB', 'SMCIB', 'NOKB',
    'WDCB', 'STXB', 'ZMB', 'AMCB', 'GMEB', 'DJTB', 'RDDTB', 'PDDB', 'HIMSB', 'ARMB',
    'MRVLB', 'GLWB', 'MRNAB', 'SPYB', 'QQQB',
  ];
  const STOCK_SYMBOLS = STOCK_BASES.map((b) => b + 'USDT');
  const STOCK_BASE_SET = new Set(STOCK_BASES);

  let mode = 'coin';
  let topSymbols = [];

  function formatPrice(p) {
    const n = Number(p);
    if (n >= 100) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return n.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  function formatVolume(v) {
    const n = Number(v);
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  }

  function displayName(symbol) {
    const base = symbol.replace(/USDT$/, '');
    return mode === 'stock' ? base.replace(/B$/, '') : base;
  }

  function render(tickers) {
    listEl.innerHTML = tickers
      .map((t, i) => {
        const changeNum = Number(t.priceChangePercent);
        const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
        const sign = changeNum > 0 ? '+' : '';
        return `
          <div class="row" data-symbol="${t.symbol}">
            <div class="rank">${i + 1}</div>
            <div class="coin">
              <div class="coin-symbol">${displayName(t.symbol)}</div>
              <div class="coin-vol">거래대금 ${formatVolume(t.quoteVolume)}</div>
            </div>
            <div class="price">$${formatPrice(t.lastPrice)}</div>
            <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
          </div>
        `;
      })
      .join('');
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    return res.json();
  }

  async function refreshRanking() {
    try {
      let top;
      if (mode === 'stock') {
        const symbolsParam = encodeURIComponent(JSON.stringify(STOCK_SYMBOLS));
        const tickers = await fetchJson(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        tickers.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
        top = tickers.slice(0, TOP_N);
      } else {
        const all = await fetchJson('https://api.binance.com/api/v3/ticker/24hr');
        const usdt = all.filter(
          (t) =>
            t.symbol.endsWith('USDT') &&
            !t.symbol.startsWith('USD') &&
            !STOCK_BASE_SET.has(t.symbol.replace(/USDT$/, '')),
        );
        usdt.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
        top = usdt.slice(0, TOP_N);
      }
      topSymbols = top.map((t) => t.symbol);
      render(top);
      touchUpdatedAt();
    } catch (e) {
      if (!topSymbols.length) {
        listEl.innerHTML = '<div class="empty">시세를 불러오지 못했습니다</div>';
      }
    }
  }

  async function refreshPrices() {
    if (!topSymbols.length) return;
    try {
      const symbolsParam = encodeURIComponent(JSON.stringify(topSymbols));
      const tickers = await fetchJson(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
      const order = new Map(topSymbols.map((s, i) => [s, i]));
      tickers.sort((a, b) => order.get(a.symbol) - order.get(b.symbol));
      render(tickers);
      touchUpdatedAt();
    } catch (e) {
      // keep showing last known prices on transient failure
    }
  }

  function touchUpdatedAt() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    updatedAtEl.textContent = `${hh}:${mm}:${ss} 기준`;
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    topSymbols = [];
    modeTabsEl.querySelectorAll('.mode-tab').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    footerNoteEl.textContent =
      mode === 'stock'
        ? '바이낸스 토큰화 주식 기준 · 미국 증시 휴장일에도 거래 가능 · 5초마다 갱신'
        : '바이낸스(Binance) 공개 API 기준 · USDT 마켓 · 5초마다 갱신';
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    refreshRanking();
  }

  modeTabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-tab');
    if (btn) setMode(btn.dataset.mode);
  });

  refreshRanking();
  setInterval(refreshPrices, PRICE_REFRESH_MS);
  setInterval(refreshRanking, RANK_REFRESH_MS);

  /* ---------- Chart modal ---------- */
  const chartOverlay = document.getElementById('chartOverlay');
  const chartClose = document.getElementById('chartClose');
  const chartSymbolEl = document.getElementById('chartSymbol');
  const chartPriceEl = document.getElementById('chartPrice');
  const chartChangeEl = document.getElementById('chartChange');
  const chartCanvas = document.getElementById('chartCanvas');
  const chartLoadingEl = document.getElementById('chartLoading');
  const chartRangesEl = document.getElementById('chartRanges');
  const ctx = chartCanvas.getContext('2d');

  const RANGES = {
    '1D': { interval: '15m', limit: 96 },
    '1W': { interval: '1h', limit: 168 },
    '1M': { interval: '4h', limit: 180 },
  };

  let currentSymbol = null;
  let currentRange = '1D';

  function drawChart(closes) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const padTop = 10;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    const points = closes.map((c, i) => {
      const x = (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[0][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    const { interval, limit } = RANGES[currentRange];
    try {
      const klines = await fetchJson(
        `https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`,
      );
      const closes = klines.map((k) => Number(k[4]));
      const first = closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = '$' + formatPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;
      drawChart(closes);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol) {
    currentSymbol = symbol;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    chartSymbolEl.textContent = displayName(symbol);
    chartOverlay.classList.add('open');
    loadChart();
  }

  function closeChart() {
    chartOverlay.classList.remove('open');
    currentSymbol = null;
  }

  listEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) openChart(row.dataset.symbol);
  });
  chartClose.addEventListener('click', closeChart);
  chartOverlay.addEventListener('click', (e) => {
    if (e.target === chartOverlay) closeChart();
  });
  chartRangesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-range-btn');
    if (!btn) return;
    currentRange = btn.dataset.range;
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    loadChart();
  });
</script>

</body>
</html>

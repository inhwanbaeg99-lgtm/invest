<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<link rel="preconnect" href="https://fapi.binance.com" crossorigin />
<link rel="dns-prefetch" href="https://fapi.binance.com" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tickr" />
<title>Tickr</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
    --safe-bottom: env(safe-area-inset-bottom);
  }
  html.pwa-standalone {
    --safe-bottom: 34px;
  }
  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: var(--safe-bottom);
    touch-action: manipulation;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 110px;
  }
  .group-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px 8px;
  }
  .nav-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    padding-bottom: var(--safe-bottom);
  }
  .bottom-nav-bar {
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .bottom-nav-bar.ready {
    opacity: 1;
  }
  .nav-highlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-highlight {
      transition: none;
    }
  }
  .nav-btn {
    position: relative;
    z-index: 1;
    width: 92px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .nav-btn.active {
    color: #04201d;
  }
  .top-header {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: 16px;
    margin-bottom: -16px;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .currency-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .currency-btn {
    width: 33px;
    height: 27px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--accent);
    color: #04201d;
  }
  .search-icon-btn {
    width: 42px;
    height: 32px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mode-tabs-wrap {
    position: relative;
    margin: 0 -16px 12px;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    padding: 0 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mode-tabs::-webkit-scrollbar {
    display: none;
  }
  .tabs-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
  }
  .tabs-fade.show {
    opacity: 1;
  }
  .tabs-fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  .tabs-fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }
  .mode-tab {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .search-page {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .search-page.open {
    display: flex;
  }
  .search-page-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .search-page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex: 0 0 auto;
  }
  .search-input-row {
    position: relative;
    margin-top: 14px;
    flex: 0 0 auto;
  }
  .search-input-row svg.search-input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .search-page-input {
    width: 100%;
    height: 48px;
    padding: 0 44px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .search-page-input::placeholder {
    color: var(--ink-sub);
  }
  .search-page-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear-btn[hidden] {
    display: none;
  }
  .search-page-list {
    margin-top: 20px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .row.search-row-item {
    grid-template-columns: 1fr auto auto;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: #1a1d22;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  /* ---------- Home ---------- */
  .list.home-view {
    background: none;
    border: none;
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .home-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .portfolio-card {
    cursor: pointer;
  }
  .portfolio-label {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }
  .portfolio-total {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .portfolio-pnl {
    margin-top: 4px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .portfolio-pnl.up { color: var(--up); }
  .portfolio-pnl.down { color: var(--down); }
  .add-holding-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .home-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .home-section-title {
    font-size: 15px;
    font-weight: 800;
  }
  .home-edit-link {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-sub);
    cursor: pointer;
  }
  .watchlist-remove-btn {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 999px;
    background: var(--down);
    color: #fff;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .holding-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .holding-row:last-child {
    border-bottom: none;
  }
  .holding-row:hover {
    background: #1a1d22;
  }
  .holding-badge-slot {
    flex: 0 0 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .holding-badge {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: var(--accent);
    color: #04201d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }
  .holding-info {
    flex: 1;
    min-width: 0;
  }
  .holding-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .holding-sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--ink-sub);
  }
  .holding-right {
    flex: 0 0 auto;
    text-align: right;
  }
  .holding-value {
    font-size: 15px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .holding-pnl {
    margin-top: 2px;
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .holding-pnl.up { color: var(--up); }
  .holding-pnl.down { color: var(--down); }
  .indicators-table {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    margin-top: 8px;
    border-radius: 10px;
    overflow: hidden;
  }
  .indicator-cell {
    background: var(--panel);
    padding: 12px;
  }
  .fng-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 6px;
  }
  .indicator-label {
    font-size: 12px;
    color: var(--ink-sub);
    margin-bottom: 6px;
  }
  .indicator-value {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .indicator-change {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
  }
  .indicator-change.up { color: var(--up); }
  .indicator-change.down { color: var(--down); }
  .fng-card {
    text-align: center;
    padding: 4px 8px;
  }
  .fng-gauge-svg {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 2px;
  }
  .fng-value {
    margin-top: -6px;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .fng-label {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .fng-label.up { color: var(--up); }
  .fng-label.down { color: var(--down); }
  .news-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
  }
  .news-item {
    display: block;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .news-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .news-source {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .news-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  .news-time {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink-sub);
  }

  /* ---------- Add holding overlay ---------- */
  .add-holding-page {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .add-holding-page.open {
    display: flex;
  }
  .add-holding-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .add-holding-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex: 0 0 auto;
  }
  .add-holding-search-row {
    position: relative;
    flex: 0 0 auto;
  }
  .add-holding-search-row svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .add-holding-search-input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .add-holding-search-input::placeholder {
    color: var(--ink-sub);
  }
  .add-holding-search-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-holding-results {
    margin-top: 16px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .add-holding-form {
    margin-top: 16px;
    flex: 0 0 auto;
  }
  .add-holding-selected {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .add-holding-selected-name {
    font-size: 15px;
    font-weight: 800;
  }
  .add-holding-selected-kr {
    font-size: 12px;
    color: var(--ink-sub);
  }
  .add-holding-change-btn {
    text-align: center;
    margin-bottom: 16px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
  }
  .add-holding-field {
    margin-bottom: 14px;
  }
  .add-holding-field label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-sub);
    margin-bottom: 6px;
  }
  .add-holding-field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box;
  }
  .add-holding-field input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-holding-submit {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #04201d;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .add-holding-submit:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* ---------- News detail overlay ---------- */
  .news-detail-page {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .news-detail-page.open {
    display: flex;
  }
  .news-detail-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .news-detail-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    flex: 0 0 auto;
  }
  .news-detail-meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex: 0 0 auto;
  }
  .news-detail-body-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .portfolio-detail-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .news-detail-meta {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .news-detail-source {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .news-detail-time {
    font-size: 12px;
    color: var(--ink-sub);
  }
  .news-detail-original-link {
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
  .news-detail-title {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.4;
  }
  .news-detail-summary {
    margin-top: 16px;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 0 calc(20px + var(--safe-bottom));
  }
  .chart-overlay.open {
    display: flex;
  }
  .chart-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
  }
  .chart-modal-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    flex: 0 0 auto;
  }
  .chart-symbol-row {
    display: flex;
    align-items: center;

  function formatPrice(p) {
    const n = Number(p);
    if (currency === 'KRW' && krwRate) {
      return Math.round(n * krwRate).toLocaleString('ko-KR') + '원';
    }
    if (n >= 100) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  // Formats a number that's already denominated in the current display currency
  // (no USD->KRW conversion), used for holding cost-basis figures entered directly
  // by the user rather than derived from today's FX rate.
  function formatNativeAmount(n) {
    const v = Number(n);
    if (currency === 'KRW') return Math.round(v).toLocaleString('ko-KR') + '원';
    if (v >= 100) return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (v >= 1) return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return '$' + v.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  // Formats the OTHER currency from the one currently toggled, for the small
  // secondary price label next to the main chart price (e.g. main "19,455원",
  // secondary "$14.31").
  function formatSecondaryPrice(usdPrice) {
    const n = Number(usdPrice);
    if (currency === 'KRW') {
      if (n >= 100) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 4 });
      return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 6 });
    }
    if (!krwRate) return '';
    return Math.round(n * krwRate).toLocaleString('ko-KR') + '원';
  }

  // Live-formats a number input as the user types: adds thousands commas and
  // an optional currency prefix/suffix (e.g. "21874" -> "21,874원").
  function formatMaskedValue(raw, { prefix = '', suffix = '', decimals = 0 } = {}) {
    if (!raw) return '';
    const [intRaw, decRaw] = raw.split('.');
    const intPart = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const out = decimals > 0 && decRaw !== undefined ? `${intPart}.${decRaw}` : intPart;
    return prefix + out + suffix;
  }
  function attachMaskedNumberInput(el, opts) {
    el.addEventListener('input', () => {
      let raw = el.value.replace(/[^\d.]/g, '');
      if (opts.decimals <= 0) {
        raw = raw.replace(/\./g, '');
      } else {
        const firstDot = raw.indexOf('.');
        if (firstDot !== -1) {
          raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
          const [i, d] = raw.split('.');
          raw = d.length > opts.decimals ? `${i}.${d.slice(0, opts.decimals)}` : raw;
        }
      }
      el.value = formatMaskedValue(raw, opts);
    });
  }
  function parseMaskedNumber(value) {
    const n = Number(String(value).replace(/[^\d.]/g, ''));
    return Number.isFinite(n) ? n : 0;
  }

  function displayName(symbol) {
    return symbol.replace(/USDT$/, '');

  function krName(name, cat) {
    return (KR_NAMES[cat || mode] || {})[name];

  function categoryFilter(t) {
    if (!t.symbol.endsWith('USDT')) return false;
    const meta = symbolMeta[t.symbol];
    if (!meta || meta.status !== 'TRADING') return false;
    const base = meta.base;
    switch (mode) {
      case 'domestic':
        return meta.type === 'KR_EQUITY';
      case 'us':
        return meta.type === 'EQUITY' && !LEVERAGE_TICKERS.has(base) && !INDEX_COMMODITY_TICKERS.has(base);
      case 'leverage':
        return LEVERAGE_TICKERS.has(base);
      case 'index':
        return INDEX_COMMODITY_TICKERS.has(base);
      case 'crypto':
        return meta.type === 'COIN' && meta.contractType === 'PERPETUAL';
      default:
        return false;
    }
  }

  function renderRows(tickers) {
    return tickers
      .map((t, i) => {
        const changeNum = Number(t.priceChangePercent);
        const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
        const sign = changeNum > 0 ? '+' : '';
        const name = displayName(t.symbol);
        const kr = krName(name);
        return `
          <div class="row" data-symbol="${t.symbol}" data-cat="${mode}">
            <div class="rank">${i + 1}</div>
            <div class="coin">
              <div class="coin-symbol">${name}</div>
              ${kr ? `<div class="coin-vol">${kr}</div>` : ''}
            </div>
            <div class="price">${formatPrice(t.lastPrice)}</div>
            <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
          </div>
        `;
      })
      .join('');
  }

  function renderCurrent() {
    if (view === 'home') {
      renderHome();
      return;
    }
    if (view === 'news') {
      renderNews();

    }
    if (mode === 'watchlist') {
      renderWatchlistTab();

    const filtered = fullTickers.filter(categoryFilter);
    filtered.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
    rawTickers = mode === 'us' || mode === 'crypto' ? filtered.slice(0, TOP_N) : filtered;
    render(rawTickers);

  function findTicker(symbol) {
    return fullTickers.find((t) => t.symbol === symbol);
  }

  function holdingStats(h) {
    const t = findTicker(h.symbol);
    const lastPrice = t ? Number(t.lastPrice) : 0;
    const changePct = t ? Number(t.priceChangePercent) : 0;
    const valueUsd = h.qty * lastPrice;
    // Current value always converts at today's FX rate (that's genuinely what
    // it's worth right now). Cost basis uses whichever currency's price the
    // user actually entered, with no conversion -- the won/dollar prices were
    // recorded independently since the FX rate at "purchase" time may differ
    // from today's, and re-deriving one from the other would drift.
    const valueNative = currency === 'KRW' && krwRate ? valueUsd * krwRate : valueUsd;
    const avgPriceNative = currency === 'KRW' ? h.avgPriceKrw || 0 : h.avgPriceUsd || 0;
    const costNative = h.qty * avgPriceNative;
    const pnlNative = valueNative - costNative;
    const pnlPct = costNative ? (pnlNative / costNative) * 100 : 0;
    return { lastPrice, changePct, valueNative, costNative, pnlNative, pnlPct };
  }

  function renderHome() {
    const stats = holdings.map((h) => ({ h, s: holdingStats(h) }));
    const totalValueNative = stats.reduce((sum, { s }) => sum + s.valueNative, 0);
    const totalCostNative = stats.reduce((sum, { s }) => sum + s.costNative, 0);
    const totalPnlNative = totalValueNative - totalCostNative;
    const totalPnlPct = totalCostNative ? (totalPnlNative / totalCostNative) * 100 : 0;
    const pnlCls = totalPnlNative > 0 ? 'up' : totalPnlNative < 0 ? 'down' : '';

    const indicatorsHtml = `

          ${indicatorCardHtml('환율', krwRate ? Math.round(krwRate).toLocaleString('ko-KR') + '원' : '-', null)}

        </div>
      </div>
    `;

    function fngGaugeSvg(value) {
      const cx = 100;
      const cy = 92;
      const r = 78;
      const sw = 16;
      const v = Math.max(0, Math.min(100, value));
      const pointAt = (val, rad) => {
        const a = Math.PI - (val / 100) * Math.PI;
        return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)];
      };
      const segments = [
        { from: 0, to: 20, color: '#ff3b30' },
        { from: 20, to: 40, color: '#ff9500' },
        { from: 40, to: 60, color: '#f2d000' },
        { from: 60, to: 80, color: '#a8d400' },
        { from: 80, to: 100, color: '#2ecc71' },
      ];
      const arcs = segments
        .map((seg) => {
          const [x1, y1] = pointAt(seg.from, r);
          const [x2, y2] = pointAt(seg.to, r);
          return `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-linecap="butt" />`;
        })
        .join('');
      const [nx, ny] = pointAt(v, r - sw / 2 - 6);
      return `
        <svg viewBox="0 0 200 102" class="fng-gauge-svg">
          ${arcs}
          <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          <circle cx="${cx}" cy="${cy}" r="5" fill="#fff" />
        </svg>
      `;
    }

    function fngCardHtml(label, fng) {
      const cls = fng ? (fng.label.includes('fear') ? 'down' : fng.label.includes('greed') ? 'up' : '') : '';
      return `
        <div class="fng-card">
          <div class="indicator-label">${label}</div>
          ${fng ? fngGaugeSvg(fng.value) : ''}
          <div class="fng-value">${fng ? fng.value : '-'}</div>
          ${fng ? `<div class="fng-label ${cls}">${FNG_LABELS_KR[fng.label] || fng.label}</div>` : ''}
        </div>
      `;
    }

    const fearGreedHtml = `
      <div class="home-card">
        <div class="portfolio-label">공포·탐욕 지수</div>
        <div class="fng-grid">
          ${fngCardHtml('주식', stockFearGreed)}
          ${fngCardHtml('코인', cryptoFearGreed)}
        </div>
      </div>
    `;

    listEl.innerHTML = portfolioHtml + indicatorsHtml + fearGreedHtml;

  function renderPortfolioDetail() {

  async function translateText(text) {
    try {
      const res = await fetchJson(
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(text)}`,
      );
      return res[0].map((seg) => seg[0]).join('');
    } catch (e) {
      return text;
    }
  }

  function timeAgo(dateStr, tz) {
    const diffMs = Date.now() - new Date(dateStr.replace(' ', 'T') + (tz || '+09:00')).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return '방금 전';
    if (mins < 60) return `${mins}분 전`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}시간 전`;
    return `${Math.floor(hours / 24)}일 전`;
  }

  async function loadNews() {
    if (newsLoading) return;
    newsLoading = true;
    try {
      const results = await Promise.allSettled(
        NEWS_SOURCES.map((src) =>
          fetchJson(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`).then(
            (data) => ({ src, data }),
          ),
        ),
      );
      const merged = [];
      results.forEach((r) => {
        if (r.status !== 'fulfilled' || !r.value.data || r.value.data.status !== 'ok') return;
        const { src, data } = r.value;
        data.items.forEach((item) => {
          merged.push({
            title: item.title,
            link: item.link,
            pubDate: item.pubDate,
            summary: (item.description || item.content || '').replace(/<[^>]+>/g, '').trim(),
            sourceName: src.name,
            tz: src.tz,
            lang: src.lang,
            ts: new Date(item.pubDate.replace(' ', 'T') + src.tz).getTime(),
          });
        });
      });
      if (merged.length) {
        merged.sort((a, b) => b.ts - a.ts);
        const top = merged.slice(0, 50);
        await Promise.allSettled(
          top
            .filter((item) => item.lang === 'en')
            .map(async (item) => {
              item.title = await translateText(item.title);
            }),
        );
        newsItems = top;
        if (view === 'news') renderNews();
      }
    } catch (e) {
      // keep previous items on failure
    } finally {
      newsLoading = false;
    }
  }

  };
  const INTERVAL_MS = {

    '1M': 30 * 24 * 60 * 60 * 1000,
  };

  // Regular trading-session hours per category, in the exchange's own local time.
  // Crypto has no entry -- it trades 24/7, so the 1D chart keeps its plain rolling window.
  const MARKET_HOURS = {
    domestic: { tz: 'Asia/Seoul', openMin: 9 * 60, closeMin: 15 * 60 + 30 },
    us: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60 },
    leverage: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60 },
    index: { tz: 'America/New_York', openMin: 9 * 60 + 30, closeMin: 16 * 60 },
  };

  // How far "local wall-clock time in tz" is ahead of UTC, in minutes, at the given instant
  // (handles DST automatically since it's derived from Intl at that exact instant).
  function tzOffsetMinutes(date, tz) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    }).formatToParts(date).reduce((acc, p) => ((acc[p.type] = p.value), acc), {});
    const asUtc = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
    return (asUtc - date.getTime()) / 60000;
  }

  // Resolves the most recent regular session for `cat` relative to `now`: today's
  // session (in progress or just-closed) if today is a trading day and we're past
  // open, otherwise the previous weekday's full session. No holiday calendar --
  // holidays will incorrectly read as a trading day, which is an accepted gap.
  function getRegularSession(cat, now) {
    const cfg = MARKET_HOURS[cat];
    if (!cfg) return null;
    const offsetMin = tzOffsetMinutes(now, cfg.tz);
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: cfg.tz, hourCycle: 'h23', weekday: 'short',
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    }).formatToParts(now).reduce((acc, p) => ((acc[p.type] = p.value), acc), {});
    const y = +parts.year, m = +parts.month, d = +parts.day;
    const weekdayIdx = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.weekday);

    const localToUtc = (minutesOfDay, dayOffset) =>
      Date.UTC(y, m - 1, d, 0, 0, 0) + minutesOfDay * 60000 - offsetMin * 60000 - dayOffset * 86400000;

    let dayOffset = weekdayIdx === 0 ? 2 : weekdayIdx === 6 ? 1 : 0; // roll weekends back to Friday
    let sessionOpen = localToUtc(cfg.openMin, dayOffset);
    let sessionClose = localToUtc(cfg.closeMin, dayOffset);

    if (dayOffset === 0 && now.getTime() < sessionOpen) {
      // Weekday, but before today's open -- the last completed session is the prior weekday.
      dayOffset = weekdayIdx === 1 ? 3 : 1; // Monday before open rolls back to Friday
      sessionOpen = localToUtc(cfg.openMin, dayOffset);
      sessionClose = localToUtc(cfg.closeMin, dayOffset);
    }

    return {
      start: sessionOpen,
      end: Math.max(Math.min(now.getTime(), sessionClose), sessionOpen + 60000),
      fullEnd: sessionClose,
    };
  }

  let currentSymbol = null;
  let currentCat = null;
  let currentRange = '1D';
  let chartCloses = [];
  let chartTimes = [];
  let chartRealStartIdx = 0;
  let chartTimeDomain = null;
  let scrubbing = false;

  function drawChart(closes, times, hoverIdx, realStartIdx, timeDomain) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const startIdx = Math.max(0, Math.min(closes.length - 1, realStartIdx || 0));
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[startIdx];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const padTop = 56;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    // A regular-session 1D chart reserves the full open-to-close width even while the
    // session is still in progress -- real candles only occupy the elapsed portion
    // (mapped by actual time, not by index), leaving the rest of the day blank.
    const points = closes.map((c, i) => {
      const x = timeDomain
        ? ((times[i] - timeDomain[0]) / (timeDomain[1] - timeDomain[0])) * w
        : (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[startIdx][0], points[startIdx][1]);
    for (let i = startIdx; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[startIdx][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    if (startIdx > 0) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 0; i <= startIdx; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.strokeStyle = '#8a8f9880';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(points[startIdx][0], points[startIdx][1]);
    for (let i = startIdx; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Session still in progress -- draw a dashed reference line at the current
    // price out to the right edge, and mark the live point with a dot.
    const lastPt = points[points.length - 1];
    if (timeDomain && lastPt[0] < w - 1) {
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = '#8a8f9899';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(lastPt[0], lastPt[1]);
      ctx.lineTo(w, lastPt[1]);
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(lastPt[0], lastPt[1], 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0a0b0d';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (hoverIdx != null && points[hoverIdx]) {
      const [hx, hy] = points[hoverIdx];
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, 0);
      ctx.lineTo(hx, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(hx, hy, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0a0b0d';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function formatScrubDate(ts) {
    const d = new Date(ts);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (currentRange === '1D' || currentRange === '1W') {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi}`;
    }
    return `${d.getFullYear()}.${mm}.${dd}`;
  }

  function scrubAt(clientX) {
    if (chartCloses.length < 2) return;
    const rect = chartCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    let idx;
    let hx;
    if (chartTimeDomain) {
      // Time-proportional mapping -- find the real candle nearest the scrubbed
      // pixel's corresponding time (scrubbing past the last real point just
      // re-selects it, since there's no data in the empty remaining session).
      const [ds, de] = chartTimeDomain;
      const targetTime = ds + (x / rect.width) * (de - ds);
      idx = 0;
      let best = Infinity;
      for (let i = 0; i < chartTimes.length; i++) {
        const diff = Math.abs(chartTimes[i] - targetTime);
        if (diff < best) {
          best = diff;
          idx = i;
        }
      }
      hx = ((chartTimes[idx] - ds) / (de - ds)) * rect.width;
    } else {
      idx = Math.round((x / rect.width) * (chartCloses.length - 1));
      idx = Math.max(0, Math.min(chartCloses.length - 1, idx));
      hx = (idx / (chartCloses.length - 1)) * rect.width;
    }
    drawChart(chartCloses, chartTimes, idx, chartRealStartIdx, chartTimeDomain);
    scrubDateEl.textContent = formatScrubDate(chartTimes[idx]);
    scrubPriceEl.textContent = formatPrice(chartCloses[idx]);
    chartScrubLabelEl.style.display = 'block';
    const lw = chartScrubLabelEl.offsetWidth;
    const left = Math.max(4, Math.min(rect.width - lw - 4, hx - lw / 2));
    chartScrubLabelEl.style.left = `${left}px`;
  }

  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    chartScrubLabelEl.style.display = 'none';
    drawChart(chartCloses, chartTimes, null, chartRealStartIdx, chartTimeDomain);
  }

  chartCanvas.addEventListener('mousedown', (e) => {
    scrubbing = true;
    scrubAt(e.clientX);
  });
  chartCanvas.addEventListener('mousemove', (e) => {
    if (scrubbing) scrubAt(e.clientX);
  });
  window.addEventListener('mouseup', endScrub);
  chartCanvas.addEventListener('touchstart', (e) => {
    scrubbing = true;
    scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchmove', (e) => {
    if (scrubbing) scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchend', endScrub);

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    chartScrubLabelEl.style.display = 'none';
    const { interval, limit } = RANGES[currentRange];
    const session = currentRange === '1D' ? getRegularSession(currentCat, new Date()) : null;
    const url = session
      ? `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&startTime=${session.start}&endTime=${session.end}&limit=1500`
      : `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`;
    try {
      const klines = await fetchJson(url);
      let closes = klines.map((k) => Number(k[4]));
      let times = klines.map((k) => Number(k[0]));
      const first = closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = formatPrice(last);
      chartPriceSecondaryEl.textContent = formatSecondaryPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;

      // Symbols listed more recently than the selected range (e.g. a 6-month-old
      // ETF on a 5Y chart) get fewer candles back than `limit` -- pad the front
      // with the listing price so the time axis still spans the full range
      // instead of the real data stretching to fill the whole chart width.
      // Skipped for session-anchored 1D fetches: a session simply in progress
      // (not yet at close) isn't the same thing as the symbol being too new.
      let realStartIdx = 0;
      if (!session && closes.length < limit && closes.length > 0) {
        const padCount = limit - closes.length;
        const stepMs = INTERVAL_MS[interval] || 0;
        const padClosesArr = new Array(padCount).fill(closes[0]);
        const padTimesArr = Array.from({ length: padCount }, (_, i) => times[0] - (padCount - i) * stepMs);
        closes = padClosesArr.concat(closes);
        times = padTimesArr.concat(times);
        realStartIdx = padCount;
      }

      chartCloses = closes;
      chartTimes = times;
      chartRealStartIdx = realStartIdx;
      chartTimeDomain = session ? [session.start, session.fullEnd] : null;
      drawChart(closes, times, null, realStartIdx, chartTimeDomain);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol, cat) {
    currentSymbol = symbol;
    currentCat = cat;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    const name = displayName(symbol);
    chartSymbolEl.textContent = name;
    const kr = krName(name, cat);
    chartSymbolKrEl.textContent = kr || '';
    chartSymbolKrEl.style.display = kr ? '' : 'none';
    chartOverlay.classList.add('open');
    loadChart();
  }

  function closeChart() {
    chartOverlay.classList.remove('open');
    currentSymbol = null;
    currentCat = null;
  }

  listEl.addEventListener('click', (e) => {
    if (e.target.closest('#addHoldingLink')) {
      openAddHolding();
      return;
    }
    if (e.target.closest('#portfolioCard')) {
      openPortfolioDetail();
      return;
    }
    if (e.target.closest('#watchlistAddLink')) {
      openAddWatchlist();
      return;
    }
    if (e.target.closest('#watchlistTabEditLink')) {
      watchlistTabEditMode = !watchlistTabEditMode;
      renderWatchlistTab();
      return;
    }
    const removeBtn = e.target.closest('.watchlist-remove-btn');
    if (removeBtn) {
      watchlist = watchlist.filter((w) => w.symbol !== removeBtn.dataset.remove);
      saveWatchlist();
      renderWatchlistTab();
      return;
    }
    const newsItem = e.target.closest('.news-item');
    if (newsItem) {
      openNewsDetail(Number(newsItem.dataset.index));
      return;
    }
    const row = e.target.closest('.row');
    if (row) openChart(row.dataset.symbol, row.dataset.cat);
  });

  portfolioDetailBodyEl.addEventListener('click', (e) => {
    if (e.target.closest('#portfolioAddLink')) {
      openAddHolding();
      return;
    }
    if (e.target.closest('#portfolioEditLink')) {
      portfolioEditMode = !portfolioEditMode;
      renderPortfolioDetail();
      return;
    }
    const removeBtn = e.target.closest('.watchlist-remove-btn');
    if (removeBtn) {
      holdings = holdings.filter((h) => h.symbol !== removeBtn.dataset.remove);
      saveHoldings();
      renderPortfolioDetail();
      return;
    }
    const item = e.target.closest('.holding-row');
    if (item) {
      closePortfolioDetail();
      openChart(item.dataset.symbol, item.dataset.cat);
    }
  });

  newsDetailClose.addEventListener('click', closeNewsDetail);
  newsDetailPageEl.addEventListener('click', (e) => {
    if (e.target === newsDetailPageEl) closeNewsDetail();
  });
  searchPageListEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    closeSearch();
    openChart(row.dataset.symbol, row.dataset.cat);
  });
  addHoldingResultsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) selectAddHoldingSymbol(row.dataset.symbol, row.dataset.cat);
  });
  addHoldingChangeBtn.addEventListener('click', () => {
    addHoldingSelected = null;
    addHoldingFormEl.hidden = true;
    addHoldingSearchRowEl.style.display = '';
    addHoldingResultsEl.style.display = '';
    addHoldingSearchInput.focus();
  });
  addHoldingSearchInput.addEventListener('input', () => {
    renderAddHoldingResults(addHoldingSearchInput.value);
  });
  attachMaskedNumberInput(addHoldingQtyInput, { suffix: ' 주', decimals: 8 });
  attachMaskedNumberInput(addHoldingAvgPriceKrwInput, { suffix: '원', decimals: 0 });
  attachMaskedNumberInput(addHoldingAvgPriceUsdInput, { prefix: '$', decimals: 2 });

  addHoldingSubmitBtn.addEventListener('click', () => {
    if (!addHoldingSelected) return;
    const qty = parseMaskedNumber(addHoldingQtyInput.value);
    const avgPriceKrw = parseMaskedNumber(addHoldingAvgPriceKrwInput.value);
    const avgPriceUsd = parseMaskedNumber(addHoldingAvgPriceUsdInput.value);
    if (!qty || qty <= 0 || !avgPriceKrw || avgPriceKrw <= 0 || !avgPriceUsd || avgPriceUsd <= 0) return;
    const idx = holdings.findIndex((h) => h.symbol === addHoldingSelected.symbol);
    const entry = { symbol: addHoldingSelected.symbol, cat: addHoldingSelected.cat, qty, avgPriceKrw, avgPriceUsd };
    if (idx >= 0) holdings[idx] = entry;
    else holdings.push(entry);
    saveHoldings();
    closeAddHolding();
    if (view === 'home') renderHome();
  });
  addHoldingClose.addEventListener('click', closeAddHolding);
  addHoldingPageEl.addEventListener('click', (e) => {
    if (e.target === addHoldingPageEl) closeAddHolding();
  });

  portfolioDetailClose.addEventListener('click', closePortfolioDetail);
  portfolioDetailPageEl.addEventListener('click', (e) => {
    if (e.target === portfolioDetailPageEl) closePortfolioDetail();
  });

  addWatchlistSearchInput.addEventListener('input', () => {
    renderAddWatchlistResults(addWatchlistSearchInput.value);
  });
  addWatchlistResultsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const symbol = row.dataset.symbol;
    const cat = row.dataset.cat;
    if (!watchlist.some((w) => w.symbol === symbol)) {
      watchlist.push({ symbol, cat });
      saveWatchlist();
    }
    closeAddWatchlist();
    if (mode === 'watchlist') renderWatchlistTab();
  });
  addWatchlistClose.addEventListener('click', closeAddWatchlist);
  addWatchlistPageEl.addEventListener('click', (e) => {
    if (e.target === addWatchlistPageEl) closeAddWatchlist();
  });

  chartClose.addEventListener('click', closeChart);
  chartOverlay.addEventListener('click', (e) => {
    if (e.target === chartOverlay) closeChart();
  });
  chartRangesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-range-btn');
    if (!btn) return;
    currentRange = btn.dataset.range;
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    loadChart();
  });

  function resetWrapTransform() {
    wrapEl.style.transition = 'none';
    wrapEl.style.transform = '';
  }

  // Shared edge-swipe-to-close gesture: the overlay follows the finger and
  // the page underneath parallaxes in, same as a native back transition.
  // excludeSelector lets a specific child area (e.g. the chart canvas, which
  // has its own horizontal drag-to-scrub gesture) opt out of starting a swipe.
  function attachSwipeBack(overlayEl, closeFn, excludeSelector) {
    let swipeX = 0;
    let swipeY = 0;
    let swipeStart = 0;
    let tracking = false;
    let dragging = false;

    overlayEl.addEventListener('touchstart', (e) => {
      if (excludeSelector && e.target.closest(excludeSelector)) {
        tracking = false;
        return;
      }
      tracking = true;
      dragging = false;
      swipeX = e.touches[0].clientX;
      swipeY = e.touches[0].clientY;
      swipeStart = Date.now();
      overlayEl.style.transition = 'none';
    }, { passive: true });

    overlayEl.addEventListener('touchmove', (e) => {
      if (!tracking) return;
      const dx = e.touches[0].clientX - swipeX;
      const dy = e.touches[0].clientY - swipeY;
      if (!dragging) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dy) > Math.abs(dx)) {
          tracking = false;
          return;
        }
        dragging = true;
        wrapEl.style.transition = 'none';
      }
      e.preventDefault();
      overlayEl.style.transform = `translateX(${dx}px)`;
      const progress = Math.min(Math.abs(dx) / window.innerWidth, 1);
      const dir = dx > 0 ? 1 : -1;
      wrapEl.style.transform = `translateX(${-dir * (1 - progress) * 30}%)`;
    }, { passive: false });

    overlayEl.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - swipeX;
      const dy = e.changedTouches[0].clientY - swipeY;
      const elapsed = Date.now() - swipeStart;
      const velocity = Math.abs(dx) / Math.max(elapsed, 1);
      overlayEl.style.transition = 'transform 0.25s ease';
      wrapEl.style.transition = 'transform 0.25s ease';
      if (dragging && Math.abs(dx) > Math.abs(dy) && (Math.abs(dx) > 90 || velocity > 0.5)) {
        const dir = dx > 0 ? 1 : -1;
        overlayEl.style.transform = `translateX(${dir * 100}%)`;
        wrapEl.style.transform = 'translateX(0)';
        setTimeout(() => {
          closeFn();
          overlayEl.style.transition = 'none';
          overlayEl.style.transform = '';
          resetWrapTransform();
        }, 250);
      } else {
        overlayEl.style.transform = 'translateX(0)';
        wrapEl.style.transform = 'translateX(0)';
        if (dragging) setTimeout(resetWrapTransform, 250);
      }
      dragging = false;
    }, { passive: true });
  }

  attachSwipeBack(chartOverlay, closeChart, '.chart-canvas-wrap');
  attachSwipeBack(newsDetailPageEl, closeNewsDetail, null);

  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update().catch(() => {}));
      }
    });
  }
</script>

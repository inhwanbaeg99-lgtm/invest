<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 시세</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex: 0 0 auto;
  }
  .currency-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .currency-btn {
    width: 30px;
    height: 24px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--accent);
    color: #04201d;
  }
  .updated {
    font-size: 11px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .mode-tab {
    flex: 1 1 auto;
    min-width: 0;
    height: 36px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .search-input {
    width: 100%;
    height: 40px;
    margin-bottom: 12px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    box-sizing: border-box;
  }
  .search-input::placeholder {
    color: var(--ink-sub);
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: #1a1d22;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  .chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .chart-overlay.open {
    display: flex;
  }
  .chart-modal {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  .chart-modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .chart-symbol {
    font-size: 18px;
    font-weight: 800;
  }
  .chart-close {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: #1a1d22;
    color: var(--ink-sub);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .chart-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }
  .chart-price {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chart-change {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-change.up { color: var(--up); }
  .chart-change.down { color: var(--down); }
  .chart-canvas-wrap {
    position: relative;
    height: 180px;
  }
  #chartCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-sub);
    font-size: 13px;
  }
  .chart-ranges {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }
  .chart-range-btn {
    flex: 1;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: #1a1d22;
    color: var(--ink-sub);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .chart-range-btn.active {
    background: var(--accent);
    color: #04201d;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <div class="title" id="modeTitle">가상화폐</div>
      <div class="header-right">
        <div class="currency-toggle" id="currencyToggle">
          <button type="button" class="currency-btn active" data-currency="USD">$</button>
          <button type="button" class="currency-btn" data-currency="KRW">₩</button>
        </div>
        <div class="updated" id="updatedAt">불러오는 중...</div>
      </div>
    </div>
    <div class="mode-tabs" id="modeTabs">
      <button type="button" class="mode-tab" data-mode="domestic">국내주식</button>
      <button type="button" class="mode-tab" data-mode="us">미국주식</button>
      <button type="button" class="mode-tab" data-mode="leverage">레버리지</button>
      <button type="button" class="mode-tab active" data-mode="crypto">가상화폐</button>
      <button type="button" class="mode-tab" data-mode="index">지수·원자재</button>
    </div>
    <input type="text" class="search-input" id="searchInput" placeholder="종목 검색 (티커 또는 한글 이름)" />
    <div class="list" id="list">
      <div class="empty">불러오는 중...</div>
    </div>
    <div class="footer-note" id="footerNote">바이낸스(Binance) 공개 API 기준 · USDT 마켓 · 5초마다 갱신</div>
  </div>

  <div class="chart-overlay" id="chartOverlay">
    <div class="chart-modal">
      <div class="chart-modal-header">
        <div class="chart-symbol" id="chartSymbol">BTC</div>
        <button type="button" class="chart-close" id="chartClose" aria-label="닫기">✕</button>
      </div>
      <div class="chart-price-row">
        <div class="chart-price" id="chartPrice">$0</div>
        <div class="chart-change" id="chartChange">+0.00%</div>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="chartCanvas"></canvas>
        <div class="chart-loading" id="chartLoading">불러오는 중...</div>
      </div>
      <div class="chart-ranges" id="chartRanges">
        <button type="button" class="chart-range-btn active" data-range="1D">1일</button>
        <button type="button" class="chart-range-btn" data-range="1W">1주</button>
        <button type="button" class="chart-range-btn" data-range="1M">1개월</button>
      </div>
    </div>
  </div>

<script>
  const TOP_N = 20;
  const PRICE_REFRESH_MS = 5000;
  const RANK_REFRESH_MS = 60000;
  const FX_REFRESH_MS = 10 * 60 * 1000;

  const listEl = document.getElementById('list');
  const updatedAtEl = document.getElementById('updatedAt');
  const footerNoteEl = document.getElementById('footerNote');
  const modeTabsEl = document.getElementById('modeTabs');
  const modeTitleEl = document.getElementById('modeTitle');
  const searchInputEl = document.getElementById('searchInput');
  const currencyToggleEl = document.getElementById('currencyToggle');

  // 바이낸스에 상장된 토큰화 주식(미국 증시 휴장일/주말에도 거래 가능) 심볼
  const US_STOCK_BASES = [
    'AAPLB', 'TSLAB', 'NVDAB', 'MSFTB', 'METAB', 'GOOGLB', 'AMZNB', 'NFLXB', 'ORCLB', 'ADBEB',
    'CRMB', 'IBMB', 'INTCB', 'QCOMB', 'AVGOB', 'AMDB', 'AMATB', 'ASMLB', 'TSMB', 'DELLB',
    'PYPLB', 'GSB', 'BABAB', 'COINB', 'MSTRB', 'HOODB', 'PLTRB', 'CRWDB', 'SMCIB', 'NOKB',
    'WDCB', 'STXB', 'ZMB', 'AMCB', 'GMEB', 'DJTB', 'RDDTB', 'PDDB', 'HIMSB', 'ARMB',
    'MRVLB', 'GLWB', 'MRNAB',
  ];
  const LEVERAGE_BASES = ['SOXLB', 'SOXSB', 'TQQQB', 'SQQQB'];
  const INDEX_COMMODITY_BASES = ['SPYB', 'QQQB', 'PAXG', 'XAUT'];

  // 끝에 B를 떼고 보여줘야 하는(토큰화 주식) 심볼 집합. PAXG/XAUT는 원래 티커라 제외.
  const STRIP_B_SET = new Set([...US_STOCK_BASES, ...LEVERAGE_BASES, 'SPYB', 'QQQB']);

  const MODES = {
    domestic: { label: '국내주식', kind: 'placeholder' },
    us: { label: '미국주식', kind: 'fixed', bases: US_STOCK_BASES },
    leverage: { label: '레버리지', kind: 'fixed', bases: LEVERAGE_BASES },
    crypto: { label: '가상화폐', kind: 'scan' },
    index: { label: '지수·원자재', kind: 'fixed', bases: INDEX_COMMODITY_BASES },
  };

  const KR_NAMES = {
    crypto: {
      BTC: '비트코인', ETH: '이더리움', SOL: '솔라나', XRP: '리플', ZEC: '지캐시',
      NEAR: '니어프로토콜', SUI: '수이', WLD: '월드코인', SAND: '샌드박스', BNB: '바이낸스코인',
      DOGE: '도지코인', QNT: '퀀트', UNI: '유니스왑', AVAX: '아발란체', TAO: '비트텐서',
      ADA: '에이다', TRX: '트론', LINK: '체인링크', DOT: '폴카닷', MATIC: '폴리곤',
      POL: '폴리곤', LTC: '라이트코인', SHIB: '시바이누', ATOM: '코스모스', ETC: '이더리움클래식',
      XLM: '스텔라루멘', BCH: '비트코인캐시', APT: '앱토스', ARB: '아비트럼', OP: '옵티미즘',
      FIL: '파일코인', HBAR: '헤데라', VET: '비체인', ICP: '인터넷컴퓨터', INJ: '인젝티브',
      RENDER: '렌더', FET: '페치AI', RUNE: '토르체인', ALGO: '알고랜드', GRT: '더그래프',
      SEI: '세이', TIA: '셀레스티아', STX: '스택스', IMX: '이뮤터블', AAVE: '에이브',
      MKR: '메이커', LDO: '라이도', CRV: '커브', SNX: '신세틱스', COMP: '컴파운드',
      ENJ: '엔진코인', CHZ: '칠리즈', MANA: '디센트럴랜드', AXS: '엑시인피니티', GALA: '갤럭시',
      FLOW: '플로우', EOS: '이오스', XTZ: '테조스', THETA: '세타토큰', XMR: '모네로',
      DASH: '대시', NEO: '네오', IOTA: '아이오타', KSM: '쿠사마', ZIL: '질리카',
      WAVES: '웨이브', ONE: '하모니', CELO: '셀로', KAVA: '카바', EGLD: '엘론드',
      FTM: '팬텀', ROSE: '오아시스', GMT: '스텝앤', APE: '에이프코인', PEPE: '페페',
      BONK: '봉크', WIF: '도지위프햇', FLOKI: '플로키', ORDI: '오디널스', TON: '톤코인',
      JUP: '주피터', PYTH: '피스네트워크', JTO: '지토', STRK: '스타크넷', DYDX: '디와이디엑스',
      ENA: '에테나', W: '웜홀', ONDO: '온도파이낸스', PENDLE: '펜들', NOT: '낫코인',
      BOME: '북오브밈',
    },
    us: {
      AAPL: '애플', TSLA: '테슬라', NVDA: '엔비디아', MSFT: '마이크로소프트', META: '메타',
      GOOGL: '알파벳(구글)', AMZN: '아마존', NFLX: '넷플릭스', ORCL: '오라클', ADBE: '어도비',
      CRM: '세일즈포스', IBM: 'IBM', INTC: '인텔', QCOM: '퀄컴', AVGO: '브로드컴',
      AMD: 'AMD', AMAT: '어플라이드머티리얼즈', ASML: 'ASML', TSM: 'TSMC', DELL: '델',
      PYPL: '페이팔', GS: '골드만삭스', BABA: '알리바바', COIN: '코인베이스', MSTR: '마이크로스트래티지',
      HOOD: '로빈후드', PLTR: '팔란티어', CRWD: '크라우드스트라이크', SMCI: '슈퍼마이크로', NOK: '노키아',
      WDC: '웨스턴디지털', STX: '시게이트', ZM: '줌', AMC: 'AMC', GME: '게임스탑',
      DJT: '트럼프미디어', RDDT: '레딧', PDD: '핀둬둬', HIMS: '힘스앤허스', ARM: 'ARM홀딩스',
      MRVL: '마벨', GLW: '코닝', MRNA: '모더나',
    },
    leverage: {
      SOXL: '반도체 3배 레버리지 ETF', SOXS: '반도체 3배 인버스 ETF',
      TQQQ: '나스닥100 3배 레버리지 ETF', SQQQ: '나스닥100 3배 인버스 ETF',
    },
    index: {
      SPY: 'S&P500 지수 ETF', QQQ: '나스닥100 지수 ETF', PAXG: '팍스골드(금)', XAUT: '테더골드(금)',
    },
  };

  let mode = 'crypto';
  let currency = 'USD';
  let krwRate = null;
  let topSymbols = [];
  let rawTickers = [];
  let searchQuery = '';

  function formatPrice(p) {
    const n = Number(p);
    if (currency === 'KRW' && krwRate) {
      return '₩' + Math.round(n * krwRate).toLocaleString('ko-KR');
    }
    if (n >= 100) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  function formatVolume(v) {
    const n = Number(v);
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toFixed(0);
  }

  function displayName(symbol) {
    const base = symbol.replace(/USDT$/, '');
    return STRIP_B_SET.has(base) ? base.replace(/B$/, '') : base;
  }

  function krName(name) {
    return (KR_NAMES[mode] || {})[name];
  }

  function applySearch(tickers) {
    if (!searchQuery) return tickers;
    const q = searchQuery.toLowerCase();
    return tickers.filter((t) => {
      const name = displayName(t.symbol).toLowerCase();
      const kr = (krName(displayName(t.symbol)) || '').toLowerCase();
      return name.includes(q) || kr.includes(q);
    });
  }

  function render(tickers) {
    if (!tickers.length) {
      listEl.innerHTML = `<div class="empty">${searchQuery ? '검색 결과가 없습니다' : '불러오는 중...'}</div>`;
      return;
    }
    listEl.innerHTML = tickers
      .map((t, i) => {
        const changeNum = Number(t.priceChangePercent);
        const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
        const sign = changeNum > 0 ? '+' : '';
        const name = displayName(t.symbol);
        const kr = krName(name);
        return `
          <div class="row" data-symbol="${t.symbol}">
            <div class="rank">${i + 1}</div>
            <div class="coin">
              <div class="coin-symbol">${name}</div>
              <div class="coin-vol">${kr ? kr + ' · ' : ''}거래대금 ${formatVolume(t.quoteVolume)}</div>
            </div>
            <div class="price">${formatPrice(t.lastPrice)}</div>
            <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
          </div>
        `;
      })
      .join('');
  }

  function renderCurrent() {
    render(applySearch(rawTickers));
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    return res.json();
  }

  async function loadFxRate() {
    try {
      const data = await fetchJson('https://open.er-api.com/v6/latest/USD');
      if (data && data.rates && data.rates.KRW) krwRate = data.rates.KRW;
    } catch (e) {
      // keep previous rate on failure
    }
  }

  async function refreshRanking() {
    const cfg = MODES[mode];
    if (cfg.kind === 'placeholder') {
      topSymbols = [];
      rawTickers = [];
      listEl.innerHTML = '<div class="empty">준비 중입니다</div>';
      touchUpdatedAt();
      return;
    }
    try {
      let top;
      if (cfg.kind === 'scan') {
        const excluded = new Set(
          [...US_STOCK_BASES, ...LEVERAGE_BASES, ...INDEX_COMMODITY_BASES].map((b) => b + 'USDT'),
        );
        const all = await fetchJson('https://api.binance.com/api/v3/ticker/24hr');
        const usdt = all.filter(
          (t) => t.symbol.endsWith('USDT') && !t.symbol.startsWith('USD') && !excluded.has(t.symbol),
        );
        usdt.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
        top = usdt.slice(0, TOP_N);
      } else {
        const symbols = cfg.bases.map((b) => b + 'USDT');
        const symbolsParam = encodeURIComponent(JSON.stringify(symbols));
        const tickers = await fetchJson(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        tickers.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
        top = tickers;
      }
      topSymbols = top.map((t) => t.symbol);
      rawTickers = top;
      renderCurrent();
      touchUpdatedAt();
    } catch (e) {
      if (!topSymbols.length) {
        listEl.innerHTML = '<div class="empty">시세를 불러오지 못했습니다</div>';
      }
    }
  }

  async function refreshPrices() {
    if (!topSymbols.length) return;
    try {
      const symbolsParam = encodeURIComponent(JSON.stringify(topSymbols));
      const tickers = await fetchJson(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
      const order = new Map(topSymbols.map((s, i) => [s, i]));
      tickers.sort((a, b) => order.get(a.symbol) - order.get(b.symbol));
      rawTickers = tickers;
      renderCurrent();
      touchUpdatedAt();
    } catch (e) {
      // keep showing last known prices on transient failure
    }
  }

  function touchUpdatedAt() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    updatedAtEl.textContent = `${hh}:${mm}:${ss} 기준`;
  }

  const FOOTER_NOTES = {
    domestic: '국내 주식은 준비 중입니다',
    us: '바이낸스 토큰화 주식 기준 · 미국 증시 휴장일에도 거래 가능 · 5초마다 갱신',
    leverage: '바이낸스 토큰화 레버리지 ETF 기준 · 5초마다 갱신',
    crypto: '바이낸스(Binance) 공개 API 기준 · USDT 마켓 · 5초마다 갱신',
    index: '지수 ETF 및 금 토큰(PAXG·XAUT) 기준 · 5초마다 갱신',
  };

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    topSymbols = [];
    rawTickers = [];
    modeTabsEl.querySelectorAll('.mode-tab').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    modeTitleEl.textContent = MODES[mode].label;
    footerNoteEl.textContent = FOOTER_NOTES[mode];
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    refreshRanking();
  }

  modeTabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-tab');
    if (btn) setMode(btn.dataset.mode);
  });

  searchInputEl.addEventListener('input', () => {
    searchQuery = searchInputEl.value.trim();
    renderCurrent();
  });

  currencyToggleEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.currency-btn');
    if (!btn || btn.dataset.currency === currency) return;
    currency = btn.dataset.currency;
    currencyToggleEl.querySelectorAll('.currency-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    renderCurrent();
    if (currentSymbol) loadChart();
  });

  loadFxRate();
  setInterval(loadFxRate, FX_REFRESH_MS);
  refreshRanking();
  setInterval(refreshPrices, PRICE_REFRESH_MS);
  setInterval(refreshRanking, RANK_REFRESH_MS);

  /* ---------- Chart modal ---------- */
  const chartOverlay = document.getElementById('chartOverlay');
  const chartClose = document.getElementById('chartClose');
  const chartSymbolEl = document.getElementById('chartSymbol');
  const chartPriceEl = document.getElementById('chartPrice');
  const chartChangeEl = document.getElementById('chartChange');
  const chartCanvas = document.getElementById('chartCanvas');
  const chartLoadingEl = document.getElementById('chartLoading');
  const chartRangesEl = document.getElementById('chartRanges');
  const ctx = chartCanvas.getContext('2d');

  const RANGES = {
    '1D': { interval: '15m', limit: 96 },
    '1W': { interval: '1h', limit: 168 },
    '1M': { interval: '4h', limit: 180 },
  };

  let currentSymbol = null;
  let currentRange = '1D';

  function drawChart(closes) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const padTop = 10;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    const points = closes.map((c, i) => {
      const x = (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[0][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    const { interval, limit } = RANGES[currentRange];
    try {
      const klines = await fetchJson(
        `https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`,
      );
      const closes = klines.map((k) => Number(k[4]));
      const first = closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = formatPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;
      drawChart(closes);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol) {
    currentSymbol = symbol;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    chartSymbolEl.textContent = displayName(symbol);
    chartOverlay.classList.add('open');
    loadChart();
  }

  function closeChart() {
    chartOverlay.classList.remove('open');
    currentSymbol = null;
  }

  listEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) openChart(row.dataset.symbol);
  });
  chartClose.addEventListener('click', closeChart);
  chartOverlay.addEventListener('click', (e) => {
    if (e.target === chartOverlay) closeChart();
  });
  chartRangesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-range-btn');
    if (!btn) return;
    currentRange = btn.dataset.range;
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    loadChart();
  });
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="preconnect" href="https://fapi.binance.com" crossorigin />
<link rel="dns-prefetch" href="https://fapi.binance.com" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tickr" />
<title>Tickr</title>
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #121418;
    --line: #22252b;
    --ink: #eef0f2;
    --ink-sub: #8a8f98;
    --up: #2ecc71;
    --down: #ff5c5c;
    --accent: #4fd1c5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 110px;
  }
  .group-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 14px 16px 8px;
  }
  .bottom-nav-bar {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .nav-highlight {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .nav-highlight {
      transition: none;
    }
  }
  .nav-btn {
    position: relative;
    z-index: 1;
    width: 92px;
    height: 46px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .nav-btn.active {
    color: #04201d;
  }
  .nav-btn.nav-btn-disabled {
    opacity: 0.3;
    cursor: default;
  }
  .top-header {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(to bottom, var(--bg) 55%, transparent 100%);
    padding-top: calc(28px + env(safe-area-inset-top));
    padding-bottom: 16px;
    margin-bottom: -16px;
  }
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .title span {
    color: var(--accent);
  }
  .currency-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }
  .currency-btn {
    width: 33px;
    height: 27px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--accent);
    color: #04201d;
  }
  .search-icon-btn {
    width: 42px;
    height: 32px;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mode-tabs-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .mode-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mode-tabs::-webkit-scrollbar {
    display: none;
  }
  .tabs-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 28px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 1;
  }
  .tabs-fade.show {
    opacity: 1;
  }
  .tabs-fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  .tabs-fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }
  .mode-tab {
    flex: 0 0 auto;
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink-sub);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #04201d;
  }
  .search-page {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(28px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
  }
  .search-page.open {
    display: flex;
  }
  .search-page-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .search-page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
    flex: 0 0 auto;
  }
  .search-input-row {
    position: relative;
    margin-top: 14px;
    flex: 0 0 auto;
  }
  .search-input-row svg.search-input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-sub);
    pointer-events: none;
  }
  .search-page-input {
    width: 100%;
    height: 48px;
    padding: 0 44px 0 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    box-sizing: border-box;
  }
  .search-page-input::placeholder {
    color: var(--ink-sub);
  }
  .search-page-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear-btn[hidden] {
    display: none;
  }
  .search-page-list {
    margin-top: 20px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .row.search-row-item {
    grid-template-columns: 1fr auto auto;
  }
  .list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row:hover {
    background: #1a1d22;
  }
  .rank {
    font-size: 12px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .coin {
    min-width: 0;
  }
  .coin-symbol {
    font-size: 15px;
    font-weight: 700;
  }
  .coin-vol {
    font-size: 11.5px;
    color: var(--ink-sub);
    font-variant-numeric: tabular-nums;
  }
  .price {
    text-align: right;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .change {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 64px;
  }
  .change.up { color: var(--up); }
  .change.down { color: var(--down); }
  .empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-sub);
    font-size: 14px;
  }
  .footer-note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--ink-sub);
    text-align: center;
  }

  .chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: none;
    justify-content: center;
    padding: calc(28px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
  }
  .chart-overlay.open {
    display: flex;
  }
  .chart-inner {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
  }
  .chart-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex: 0 0 auto;
  }
  .chart-modal-header .title {
    font-size: 24px;
    font-weight: 800;
  }
  .chart-symbol-row {
    margin-bottom: 20px;
    flex: 0 0 auto;
  }
  .chart-symbol {
    font-size: 20px;
    font-weight: 800;
  }
  .chart-symbol-kr {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-sub);
    margin-top: 2px;
  }
  .chart-close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .chart-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
    flex: 0 0 auto;
  }
  .chart-price {
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chart-change {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chart-change.up { color: var(--up); }
  .chart-change.down { color: var(--down); }
  .chart-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 180px;
    max-height: 320px;
    touch-action: pan-y;
  }
  @media (max-width: 767px) {
    .chart-canvas-wrap {
      flex: 0 0 220px;
    }
  }
  #chartCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-sub);
    font-size: 13px;
  }
  .chart-scrub-label {
    position: absolute;
    top: 0;
    display: none;
    pointer-events: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .scrub-date {
    font-size: 11px;
    color: var(--ink-sub);
  }
  .scrub-price {
    font-size: 15px;
    font-weight: 800;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .chart-ranges {
    display: flex;
    gap: 6px;
    margin-top: 20px;
    flex: 0 0 auto;
  }
  .chart-range-btn {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink-sub);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .chart-range-btn.active {
    background: var(--accent);
    color: #04201d;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="top-header">
      <div class="header">
        <div class="title-group">
          <div class="title" id="modeTitle">Tickr</div>
          <div class="currency-toggle" id="currencyToggle">
            <button type="button" class="currency-btn" data-currency="USD">$</button>
            <button type="button" class="currency-btn active" data-currency="KRW">₩</button>
          </div>
        </div>
        <button type="button" class="search-icon-btn" id="searchIconBtn" aria-label="검색">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
      <div class="mode-tabs-wrap">
        <div class="mode-tabs" id="modeTabs">
          <button type="button" class="mode-tab active" data-mode="domestic">국내주식</button>
          <button type="button" class="mode-tab" data-mode="us">미국주식</button>
          <button type="button" class="mode-tab" data-mode="leverage">레버리지</button>
          <button type="button" class="mode-tab" data-mode="crypto">가상화폐</button>
          <button type="button" class="mode-tab" data-mode="index">지수·원자재</button>
        </div>
        <div class="tabs-fade tabs-fade-left" id="tabsFadeLeft"></div>
        <div class="tabs-fade tabs-fade-right" id="tabsFadeRight"></div>
      </div>
    </div>
    <div class="list" id="list">
      <div class="empty">불러오는 중...</div>
    </div>
    <div class="footer-note" id="updatedAt">불러오는 중...</div>
  </div>

  <div class="chart-overlay" id="chartOverlay">
    <div class="chart-inner">
      <div class="chart-modal-header">
        <div class="title-group">
          <div class="title">Tickr</div>
          <div class="currency-toggle" id="chartCurrencyToggle">
            <button type="button" class="currency-btn" data-currency="USD">$</button>
            <button type="button" class="currency-btn active" data-currency="KRW">₩</button>
          </div>
        </div>
        <button type="button" class="chart-close" id="chartClose" aria-label="뒤로">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
      </div>
      <div class="chart-symbol-row">
        <div class="chart-symbol" id="chartSymbol">BTC</div>
        <div class="chart-symbol-kr" id="chartSymbolKr"></div>
      </div>
      <div class="chart-price-row">
        <div class="chart-price" id="chartPrice">$0</div>
        <div class="chart-change" id="chartChange">+0.00%</div>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="chartCanvas"></canvas>
        <div class="chart-loading" id="chartLoading">불러오는 중...</div>
        <div class="chart-scrub-label" id="chartScrubLabel">
          <div class="scrub-date" id="scrubDate"></div>
          <div class="scrub-price" id="scrubPrice"></div>
        </div>
      </div>
      <div class="chart-ranges" id="chartRanges">
        <button type="button" class="chart-range-btn active" data-range="1D">1일</button>
        <button type="button" class="chart-range-btn" data-range="1W">1주</button>
        <button type="button" class="chart-range-btn" data-range="3M">3개월</button>
        <button type="button" class="chart-range-btn" data-range="1Y">1년</button>
        <button type="button" class="chart-range-btn" data-range="5Y">5년</button>
        <button type="button" class="chart-range-btn" data-range="ALL">전체</button>
      </div>
    </div>
  </div>

  <div class="search-page" id="searchPage">
    <div class="search-page-inner">
      <div class="search-page-header">
        <div class="title-group">
          <div class="title">Tickr</div>
          <div class="currency-toggle" id="searchCurrencyToggle">
            <button type="button" class="currency-btn" data-currency="USD">$</button>
            <button type="button" class="currency-btn active" data-currency="KRW">₩</button>
          </div>
        </div>
        <button type="button" class="chart-close" id="searchPageClose" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="search-input-row">
        <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" class="search-page-input" id="searchInput" placeholder="검색어를 입력하세요" />
        <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="지우기" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>
      <div class="search-page-list" id="searchPageList"></div>
    </div>
  </div>

  <div class="bottom-nav-bar">
    <div class="nav-highlight" id="navHighlight"></div>
    <button type="button" class="nav-btn active" id="navAllBtn" aria-label="전체시세">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="12" width="4.5" height="9" rx="1" />
        <rect x="9.75" y="7" width="4.5" height="14" rx="1" />
        <rect x="16.5" y="3" width="4.5" height="18" rx="1" />
      </svg>
    </button>
    <button type="button" class="nav-btn" id="navHomeBtn" aria-label="홈">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 1-1.06 1.06l-.97-.97V19.5a2.25 2.25 0 0 1-2.25 2.25h-10a2.25 2.25 0 0 1-2.25-2.25v-6.88l-.97.97a.75.75 0 1 1-1.06-1.06l8.69-8.69Z" />
      </svg>
    </button>
    <button type="button" class="nav-btn nav-btn-disabled" id="navMyBtn" aria-label="준비 중">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.5 21a3 3 0 0 0 3-3v-4.5a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3V18a3 3 0 0 0 3 3h15ZM1.5 10.146V6a3 3 0 0 1 3-3h5.379a2.25 2.25 0 0 1 1.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 0 1 3 3v1.146A4.483 4.483 0 0 0 19.5 9h-15a4.483 4.483 0 0 0-3 1.146Z" />
      </svg>
    </button>
  </div>

<script>
  const FAPI = 'https://fapi.binance.com/fapi/v1';
  const TOP_N = 20;
  const REFRESH_MS = 5000;
  const FX_REFRESH_MS = 10 * 60 * 1000;

  const listEl = document.getElementById('list');
  const updatedAtEl = document.getElementById('updatedAt');
  const modeTabsEl = document.getElementById('modeTabs');
  const tabsFadeLeftEl = document.getElementById('tabsFadeLeft');
  const tabsFadeRightEl = document.getElementById('tabsFadeRight');
  const searchIconBtn = document.getElementById('searchIconBtn');
  const searchPageEl = document.getElementById('searchPage');
  const searchPageClose = document.getElementById('searchPageClose');
  const searchInputEl = document.getElementById('searchInput');
  const searchClearBtn = document.getElementById('searchClearBtn');
  const searchPageListEl = document.getElementById('searchPageList');
  const currencyToggleEls = document.querySelectorAll('.currency-toggle');
  const navAllBtn = document.getElementById('navAllBtn');
  const navHomeBtn = document.getElementById('navHomeBtn');
  const navHighlightEl = document.getElementById('navHighlight');

  function moveNavHighlight(btn) {
    navHighlightEl.style.width = btn.offsetWidth + 'px';
    navHighlightEl.style.height = btn.offsetHeight + 'px';
    navHighlightEl.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
  }

  // 레버리지/인버스 ETF와 지수 추종 ETF는 바이낸스 선물 API에서 EQUITY로 묶여 있어서 직접 분리
  const LEVERAGE_TICKERS = new Set(['SOXL', 'SOXS', 'TQQQ', 'SQQQ', 'KORU', 'RAM', 'RAMZ', 'UVXY']);
  const INDEX_COMMODITY_TICKERS = new Set([
    'XAU', 'CL', 'XAG', 'BZ', 'QQQ', 'EWY', 'SPY', 'NATGAS', 'COPPER',

  function formatPrice(p) {
    const n = Number(p);
    if (currency === 'KRW' && krwRate) {
      return Math.round(n * krwRate).toLocaleString('ko-KR') + '원';
    }
    if (n >= 100) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (n >= 1) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 6 });
  }

  function displayName(symbol) {
    return symbol.replace(/USDT$/, '');

  function krName(name, cat) {
    return (KR_NAMES[cat || mode] || {})[name];

  function categoryFilter(t) {
    if (!t.symbol.endsWith('USDT')) return false;
    const meta = symbolMeta[t.symbol];
    if (!meta || meta.status !== 'TRADING') return false;
    const base = meta.base;
    switch (mode) {
      case 'domestic':
        return meta.type === 'KR_EQUITY';
      case 'us':
        return meta.type === 'EQUITY' && !LEVERAGE_TICKERS.has(base) && !INDEX_COMMODITY_TICKERS.has(base);
      case 'leverage':
        return LEVERAGE_TICKERS.has(base);
      case 'index':
        return INDEX_COMMODITY_TICKERS.has(base);
      case 'crypto':
        return meta.type === 'COIN' && meta.contractType === 'PERPETUAL';
      default:
        return false;
    }
  }

  function renderRows(tickers) {
    return tickers
      .map((t, i) => {
        const changeNum = Number(t.priceChangePercent);
        const cls = changeNum > 0 ? 'up' : changeNum < 0 ? 'down' : '';
        const sign = changeNum > 0 ? '+' : '';
        const name = displayName(t.symbol);
        const kr = krName(name);
        return `
          <div class="row" data-symbol="${t.symbol}" data-cat="${mode}">
            <div class="rank">${i + 1}</div>
            <div class="coin">
              <div class="coin-symbol">${name}</div>
              ${kr ? `<div class="coin-vol">${kr}</div>` : ''}
            </div>
            <div class="price">${formatPrice(t.lastPrice)}</div>
            <div class="change ${cls}">${sign}${changeNum.toFixed(2)}%</div>
          </div>
        `;
      })
      .join('');
  }

    filtered.sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));
    rawTickers = mode === 'us' || mode === 'crypto' ? filtered.slice(0, TOP_N) : filtered;
    render(rawTickers);

  function renderSearchRow(t, cat) {

    const sign = changeNum > 0 ? '+' : '';

  }

  function performGlobalSearch(query) {
    const q = query.trim().toLowerCase();
    searchClearBtn.hidden = !query;
    if (!q) {
      searchPageListEl.innerHTML = '';
      return;
    }
    const savedMode = mode;
    const matches = [];
    ALL_CATEGORIES.forEach((cat) => {
      mode = cat;
      fullTickers.filter(categoryFilter).forEach((t) => {
        const name = displayName(t.symbol).toLowerCase();
        const kr = (krName(displayName(t.symbol)) || '').toLowerCase();
        if (name.includes(q) || kr.includes(q)) matches.push({ t, cat });
      });
    });
    mode = savedMode;
    matches.sort((a, b) => Number(b.t.quoteVolume) - Number(a.t.quoteVolume));
    searchPageListEl.innerHTML = matches.length
      ? matches.map(({ t, cat }) => renderSearchRow(t, cat)).join('')
      : '<div class="empty">검색 결과가 없습니다</div>';
  }

  const ctx = chartCanvas.getContext('2d');

  const RANGES = {
    '1D': { interval: '15m', limit: 96 },
    '1W': { interval: '1h', limit: 168 },
    '3M': { interval: '1d', limit: 90 },
    '1Y': { interval: '1d', limit: 365 },
    '5Y': { interval: '1w', limit: 260 },
    ALL: { interval: '1M', limit: 1000 },
  };

  let currentSymbol = null;
  let currentRange = '1D';
  let chartCloses = [];
  let chartTimes = [];
  let scrubbing = false;

  function drawChart(closes, hoverIdx) {
    const wrap = chartCanvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    chartCanvas.width = w * dpr;
    chartCanvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (closes.length < 2) return;

    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? '#2ecc71' : '#ff5c5c';
    const padTop = 10;
    const padBottom = 10;
    const usableH = h - padTop - padBottom;

    const points = closes.map((c, i) => {
      const x = (i / (closes.length - 1)) * w;
      const y = padTop + (1 - (c - min) / range) * usableH;
      return [x, y];
    });

    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, color + '55');
    gradient.addColorStop(1, color + '00');

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(points[points.length - 1][0], h);
    ctx.lineTo(points[0][0], h);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    if (hoverIdx != null && points[hoverIdx]) {
      const [hx, hy] = points[hoverIdx];
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx, 0);
      ctx.lineTo(hx, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(hx, hy, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#0a0b0d';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function formatScrubDate(ts) {
    const d = new Date(ts);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    if (currentRange === '1D' || currentRange === '1W') {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${mm}/${dd} ${hh}:${mi}`;
    }
    return `${d.getFullYear()}.${mm}.${dd}`;
  }

  function scrubAt(clientX) {
    if (chartCloses.length < 2) return;
    const rect = chartCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    let idx = Math.round((x / rect.width) * (chartCloses.length - 1));
    idx = Math.max(0, Math.min(chartCloses.length - 1, idx));
    drawChart(chartCloses, idx);
    scrubDateEl.textContent = formatScrubDate(chartTimes[idx]);
    scrubPriceEl.textContent = formatPrice(chartCloses[idx]);
    chartScrubLabelEl.style.display = 'block';
    const lw = chartScrubLabelEl.offsetWidth;
    const hx = (idx / (chartCloses.length - 1)) * rect.width;
    const left = Math.max(4, Math.min(rect.width - lw - 4, hx - lw / 2));
    chartScrubLabelEl.style.left = `${left}px`;
  }

  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    chartScrubLabelEl.style.display = 'none';
    drawChart(chartCloses);
  }

  chartCanvas.addEventListener('mousedown', (e) => {
    scrubbing = true;
    scrubAt(e.clientX);
  });
  chartCanvas.addEventListener('mousemove', (e) => {
    if (scrubbing) scrubAt(e.clientX);
  });
  window.addEventListener('mouseup', endScrub);
  chartCanvas.addEventListener('touchstart', (e) => {
    scrubbing = true;
    scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchmove', (e) => {
    if (scrubbing) scrubAt(e.touches[0].clientX);
  }, { passive: true });
  chartCanvas.addEventListener('touchend', endScrub);

  async function loadChart() {
    if (!currentSymbol) return;
    chartLoadingEl.style.display = 'flex';
    chartScrubLabelEl.style.display = 'none';
    const { interval, limit } = RANGES[currentRange];
    try {
      const klines = await fetchJson(
        `${FAPI}/klines?symbol=${currentSymbol}&interval=${interval}&limit=${limit}`,
      );
      const closes = klines.map((k) => Number(k[4]));
      const times = klines.map((k) => Number(k[0]));
      const first = closes[0];
      const last = closes[closes.length - 1];
      const changePct = ((last - first) / first) * 100;
      const cls = changePct > 0 ? 'up' : changePct < 0 ? 'down' : '';
      const sign = changePct > 0 ? '+' : '';
      chartPriceEl.textContent = formatPrice(last);
      chartChangeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
      chartChangeEl.className = `chart-change ${cls}`;
      chartCloses = closes;
      chartTimes = times;
      drawChart(closes);
    } catch (e) {
      chartLoadingEl.textContent = '차트를 불러오지 못했습니다';
      chartLoadingEl.style.display = 'flex';
      return;
    }
    chartLoadingEl.style.display = 'none';
  }

  function openChart(symbol, cat) {
    currentSymbol = symbol;
    currentRange = '1D';
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.range === currentRange);
    });
    const name = displayName(symbol);
    chartSymbolEl.textContent = name;
    const kr = krName(name, cat);
    chartSymbolKrEl.textContent = kr || '';
    chartSymbolKrEl.style.display = kr ? '' : 'none';
    chartOverlay.classList.add('open');
    loadChart();
  }

  function closeChart() {
    chartOverlay.classList.remove('open');
    currentSymbol = null;
  }

  listEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) openChart(row.dataset.symbol, row.dataset.cat);
  });
  searchPageListEl.addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    closeSearch();
    openChart(row.dataset.symbol, row.dataset.cat);
  });
  chartClose.addEventListener('click', closeChart);
  chartOverlay.addEventListener('click', (e) => {
    if (e.target === chartOverlay) closeChart();
  });
  chartRangesEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chart-range-btn');
    if (!btn) return;
    currentRange = btn.dataset.range;
    chartRangesEl.querySelectorAll('.chart-range-btn').forEach((b) => {
      b.classList.toggle('active', b === btn);
    });
    loadChart();
  });

  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && navigator.serviceWorker.controller) {
        navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update().catch(() => {}));
      }
    });
  }
</script>

</body>
</html>
